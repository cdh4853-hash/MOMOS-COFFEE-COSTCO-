    if(!data || data.length===0){ toast('삭제 권한이 없어 반영되지 않았습니다. 관리자에게 DB 권한 확인을 요청해 주세요.','err'); return; }
    toast('발주가 삭제되었습니다.','ok');
    switchTab('orders');
  }catch(e){ toast(friendlyError(e),'err'); }
}
async function saveOrder(orderId){
  const order_no = document.getElementById('ordNo').value.trim();
  const requested_delivery_date = document.getElementById('ordReqDate').value;
  const planned_ship_date = document.getElementById('ordShipDate').value;
  const actual_delivery_date = document.getElementById('ordDeliveredDate').value || null;
  const qty = parseInt(document.getElementById('ordQty').value)||0;
  if(!order_no){ toast('발주번호를 입력해 주세요.','err'); return; }
  if(!requested_delivery_date){ toast('납품요청일을 입력해 주세요.','err'); return; }
  if(!planned_ship_date){ toast('출고예정일을 입력해 주세요.','err'); return; }
  if(qty<1){ toast('파렛트수량을 입력해 주세요.','err'); return; }
  const existing = orderId ? (STATE.cache.orders||[]).find(x=>x.id===orderId) : null;

  const payload = {
    order_no, requested_delivery_date,
    country_id: document.getElementById('ordCountry').value,
    destination_id: document.getElementById('ordDest').value || null,
    product_id: document.getElementById('ordProduct').value,
    planned_pallet_count: qty,
    notes: document.getElementById('ordNotes').value.trim() || null,
    updated_by: STATE.profile.id,
  };
  const statusEl = document.getElementById('ordStatus');
  if(statusEl) payload.status = statusEl.value;

  // 출고예정일/납품일 변경 여부 확인
  const shipChanged = existing && planned_ship_date !== (existing.planned_ship_date||'');
  const deliveredChanged = existing && actual_delivery_date !== (existing.actual_delivery_date||null);
  const needsApproval = existing && existing.production_confirmed && (shipChanged || deliveredChanged);

  if(needsApproval){
    if(existing.change_status==='대기'){
      toast('이미 변경 승인 대기 중인 발주입니다. 승인/거절 후 다시 시도해 주세요.','err');
      return;
    }
    if(existing.change_status==='거절됨'){
      toast('직전 변경 요청이 거절된 상태입니다. 발주 목록에서 거절 내용을 먼저 확인 처리한 후 다시 요청해 주세요.','err');
      return;
    }
    // 출고예정일/납품일은 즉시 반영하지 않고 승인 대기로 등록, 나머지 항목은 바로 반영
    payload.pending_planned_ship_date = shipChanged ? planned_ship_date : null;
    payload.pending_actual_delivery_date = deliveredChanged ? actual_delivery_date : null;
    payload.change_status = '대기';
    payload.change_requested_by = STATE.profile.id;
    payload.change_requested_at = new Date().toISOString();
  }else{
    payload.planned_ship_date = planned_ship_date;
    payload.actual_delivery_date = actual_delivery_date;
  }

  try{
    if(orderId){
      const { data, error } = await sb.from('costco_orders').update(payload).eq('id', orderId).select();
      if(error) throw error;
      if(!data || data.length===0){ toast('저장 권한이 없어 반영되지 않았습니다. 관리자에게 DB 권한 확인을 요청해 주세요.','err'); return; }
    }else{
      payload.planned_ship_date = planned_ship_date;
      payload.actual_delivery_date = actual_delivery_date;
      payload.created_by = STATE.profile.id;
      const { error } = await sb.from('costco_orders').insert(payload);
      if(error) throw error;
    }
    closeModal();
    toast(needsApproval ? '나머지 항목은 저장되었고, 출고예정일/납품일 변경은 발주확인자 승인 후 반영됩니다.' : '발주가 저장되었습니다.', 'ok');
    switchTab('orders');
  }catch(e){ toast(friendlyError(e),'err'); }
}
</script>
<script>
/* ============================================================
   생산계획
   ============================================================ */
let PLAN_FILTERS = { periodMode:'month', from: todayKST().slice(0,7)+'-01', to: lastDayOfMonthISO(todayKST().slice(0,7)), status:'계획중', q:'' };
let PENDING_ORDER_VIEW = 'unmatched';
const INFLIGHT_PLAN_IDS = new Set();

async function renderProduction(){
  const [orders, plans, pallets] = await Promise.all([
    loadOrdersFull(null, null),
    loadProductionPlans(PLAN_FILTERS.from||null, PLAN_FILTERS.to||null),
    loadPalletsFull({}),
  ]);
  STATE.cache.orders = orders;
  STATE.cache.productionPlans = plans;
  STATE.cache.pallets = pallets;
  const canManage = can('admin','production_manager','shipping_manager');

  // 상단: 미출고 발주 (참고용)
  const activeOrders = orders.filter(o=>o.status!=='취소');
  const pendingOrders = activeOrders.filter(o=>orderStatusOf(o, pallets)!=='출고완료');
  const freeStock = pallets.filter(p=>p.status==='재고보유');
  const pendingRows = pendingOrders.map(o=>{
    const cov = orderCoverage(o, pallets);
    return { o, matched: cov.matched, reserved: cov.reserved, shortage: cov.shortage };
  }).sort((a,b)=> (a.o.planned_ship_date||'') < (b.o.planned_ship_date||'') ? -1 : 1);

  // 하단: 생산계획 목록
  let rows = plans;
  if(PLAN_FILTERS.status) rows = rows.filter(p=>p.status===PLAN_FILTERS.status);
  if(PLAN_FILTERS.q){
    const q = PLAN_FILTERS.q.toLowerCase();
    rows = rows.filter(p=>(p.plan_no||'').toLowerCase().includes(q));
  }
  rows.sort((a,b)=> (a.planned_production_date||'') < (b.planned_production_date||'') ? -1 : 1);
  STATE.cache.planShownRows = rows;
  const planPalletPreviewMap = await computePalletPreviewMap(plans);
  const realPalletsByPlan = {};
  pallets.forEach(pl=>{
    if(!pl.production_plan_id) return;
    (realPalletsByPlan[pl.production_plan_id] = realPalletsByPlan[pl.production_plan_id]||[]).push(pl.pallet_no);
  });
  Object.keys(realPalletsByPlan).forEach(k=>realPalletsByPlan[k].sort());

  const pendingTotal = {
    qty: pendingRows.reduce((a,r)=>a+(r.o.planned_pallet_count||0),0),
    matched: pendingRows.reduce((a,r)=>a+r.matched,0),
    shortage: pendingRows.reduce((a,r)=>a+r.shortage,0),
  };

  const unmatchedRows = pendingRows.filter(r=>r.reserved < r.o.planned_pallet_count);
  const matchedRows = pendingRows.filter(r=>r.reserved >= r.o.planned_pallet_count);
  const shownRows = PENDING_ORDER_VIEW==='matched' ? matchedRows : unmatchedRows;

  const html = `
    <div class="panel">
      <div class="panel-head">
        <h3>미출고 발주목록 (참고용)</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn ${PENDING_ORDER_VIEW==='unmatched'?'btn-primary':'btn-ghost'} btn-sm" onclick="PENDING_ORDER_VIEW='unmatched'; switchTab('production')">미매칭 (${unmatchedRows.length})</button>
          <button class="btn ${PENDING_ORDER_VIEW==='matched'?'btn-primary':'btn-ghost'} btn-sm" onclick="PENDING_ORDER_VIEW='matched'; switchTab('production')">매칭완료 (${matchedRows.length})</button>
        </div>
      </div>
      <div class="panel-body pad0"><div class="table-wrap"><table>
        <thead><tr><th>발주번호</th><th>출고예정일</th><th>국가</th><th>납품처</th><th>파렛트유형</th><th>발주수량</th><th>매칭완료</th><th>부족수량</th></tr></thead>
        <tbody>
        ${shownRows.length? shownRows.map(r=>`
          <tr>
            <td>${esc(r.o.order_no)}</td>
            <td>${fmtDateDisp(r.o.planned_ship_date)}</td>
            <td>${esc(countryName(r.o.country_id))}</td>
            <td>${esc(destinationName(r.o.destination_id))}</td>
            <td>${esc(productName(r.o.product_id))}</td>
            <td>${r.o.planned_pallet_count}</td>
            <td>${r.matched}</td>
            <td>${r.shortage>0?`<b style="color:var(--red)">${r.shortage}</b>`:'0'}</td>
          </tr>`).join('') : `<tr><td colspan="8" class="empty-row">해당하는 발주가 없습니다.</td></tr>`}
        ${pendingRows.length? `<tr style="font-weight:700;background:#fafbfc;">
            <td colspan="5">전체 합계</td>
            <td>${pendingTotal.qty}</td>
            <td>${pendingTotal.matched}</td>
            <td>${pendingTotal.shortage>0?`<b style="color:var(--red)">${pendingTotal.shortage}</b>`:'0'}</td>
          </tr>` : ''}
        </tbody>
      </table></div></div>

    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>생산계획</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn ${PLAN_FILTERS.status==='계획중'?'btn-primary':'btn-ghost'} btn-sm" onclick="PLAN_FILTERS.status='계획중'; switchTab('production')">생산대기중</button>
          <button class="btn ${PLAN_FILTERS.status==='생산완료'?'btn-primary':'btn-ghost'} btn-sm" onclick="PLAN_FILTERS.status='생산완료'; switchTab('production')">생산완료</button>
        </div>
      </div>
      <div class="panel-head" style="border-top:1px solid var(--line);">
        <div class="toolbar">
          ${periodPickerHtml(PLAN_FILTERS, 'production', 'PLAN_FILTERS')}
          <input type="text" placeholder="계획번호 검색" value="${esc(PLAN_FILTERS.q)}" oninput="debouncedPlanSearch(this.value)">
          <button class="btn btn-ghost btn-sm" onclick="exportPlansCsv()">CSV 다운로드</button>
          ${can('admin') && PLAN_FILTERS.status==='계획중'?`<button class="btn btn-danger btn-sm" onclick="deleteSelectedPlanUnits()">선택 삭제</button>`:''}
          ${canManage && PLAN_FILTERS.status==='계획중'?`<button class="btn btn-ghost btn-sm" onclick="confirmSelectedPlanUnits()">선택 생산완료</button>`:''}
          ${canManage?`<button class="btn btn-primary btn-sm" onclick="openProductionPlanModal()">+ 생산계획 등록</button>`:''}
        </div>
      </div>
      <div class="panel-body" style="padding:12px 14px;">
        ${(()=>{
          if(!rows.length) return `<div class="empty-row">등록된 생산계획이 없습니다.</div>`;
          const byDate = {};
          rows.forEach(p=>{ const d=p.planned_production_date||'미지정'; (byDate[d]=byDate[d]||[]).push(p); });
          const dateKeys = Object.keys(byDate).sort((a,b)=> a<b?1:-1);
          const grandTotalQty = rows.reduce((a,p)=>a+(p.planned_pallet_count||0),0);
          return `
          <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">총 ${dateKeys.length}개 날짜 · 계획 ${rows.length}건 · 합계 <b style="color:var(--ink);">${grandTotalQty}</b>파렛트</div>
          ${dateKeys.map(date=>{
            const dayPlans = byDate[date];
            const dayQty = dayPlans.reduce((a,p)=>a+(p.planned_pallet_count||0),0);
            const doneQty = dayPlans.filter(p=>p.status==='생산완료').reduce((a,p)=>a+(p.planned_pallet_count||0),0);
            const byCountry = {};
            dayPlans.forEach(p=>{ const c=countryName(p.country_id); byCountry[c]=(byCountry[c]||0)+(p.planned_pallet_count||0); });
            const countrySummary = Object.entries(byCountry).map(([n,q])=>`${esc(n)} ${q}`).join(' · ');
            const rowsHtml = dayPlans.flatMap(p=>{
              const n = p.planned_pallet_count || 1;
              const preview = p.status==='생산완료' ? (realPalletsByPlan[p.id] || []) : (planPalletPreviewMap[p.id] || []);
              return Array.from({length:n}, (_,idx)=>`
              <tr>
                ${can('admin')?`<td>${p.status==='계획중'?`<input type="checkbox" class="planUnitChk" value="${p.id}">`:''}</td>`:''}
                <td>${esc(preview[idx] || p.plan_no)}</td>
                <td>${esc(p.plan_no)}</td>
                <td>${esc(countryName(p.country_id))}</td>
                <td>${esc(productName(p.product_id))}</td>
                <td>1</td>
                <td>${esc(p.production_manager||'-')}</td>
                <td>${planStatusBadge(p.status)}</td>
                <td>
                  ${canManage && p.status==='계획중' ? `<button class="btn btn-ghost btn-sm" onclick="openProductionPlanModal('${p.id}')">수정</button>
                    <button class="btn btn-primary btn-sm" onclick="confirmProductionPlanUnit('${p.id}')">생산완료</button>`:''}
                  ${canManage && p.status==='생산완료' ? `<button class="btn btn-ghost btn-sm" onclick="retractProductionPlanUnit('${p.id}')">회수</button>`:''}
                  ${can('admin') && p.status==='계획중' ? `<button class="btn btn-danger btn-sm" onclick="deletePlanUnit('${p.id}')">삭제</button>`:''}
                </td>
              </tr>`);
            }).join('');
            return `
            <div class="prod-date-group prod-date-group-flat">
              <div class="prod-date-head">
                <span class="prod-date-label">${date==='미지정'?'날짜 미지정':fmtDateDisp(date)}</span>
                <span class="prod-date-meta">계획 ${dayPlans.length}건 · 합계 <b>${dayQty}</b>파렛트${doneQty>0?` · 완료 ${doneQty}`:''} · ${countrySummary}</span>
              </div>
              <div class="table-wrap"><table>
                <thead><tr>${can('admin')?'<th><input type="checkbox" onclick="toggleAllPlanChk(this)"></th>':''}<th>파렛트일련번호</th><th>계획번호</th><th>국가</th><th>파렛트유형</th><th>수량</th><th>생산담당자</th><th>상태</th><th></th></tr></thead>
                <tbody>${rowsHtml}</tbody>
              </table></div>
            </div>`;
          }).join('')}
          `;
        })()}
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}
function deletePlanUnit(planId){
  confirmModal('이 파렛트 1개 분량을 생산계획에서 삭제하시겠습니까?\n계획 전체가 아니라 1개 수량만 줄어듭니다.', async ()=>{
    try{
      const { data: plan, error: pErr } = await sb.from('costco_production_plans').select('planned_pallet_count').eq('id', planId).single();
      if(pErr) throw pErr;
      const newCount = (plan.planned_pallet_count||1) - 1;
      if(newCount<=0){
        const { error } = await sb.from('costco_production_plans').delete().eq('id', planId);
        if(error) throw error;
      }else{
        const { error } = await sb.from('costco_production_plans').update({ planned_pallet_count:newCount, updated_by:STATE.profile.id }).eq('id', planId);
        if(error) throw error;
      }
      closeModal(); toast('삭제되었습니다.','ok'); switchTab('production');
    }catch(e){ toast(friendlyError(e),'err'); }
  }, {danger:true, confirmLabel:'삭제'});
}
function toggleAllPlanChk(src){
  document.querySelectorAll('.planUnitChk').forEach(c=>{ c.checked = src.checked; });
}
function deleteSelectedPlanUnits(){
  const checked = [...document.querySelectorAll('.planUnitChk:checked')].map(c=>c.value);
  if(!checked.length){ toast('삭제할 항목을 선택해 주세요.','err'); return; }
  const counts = {};
  checked.forEach(id=>{ counts[id] = (counts[id]||0) + 1; });
  confirmModal(`선택한 파렛트 ${checked.length}개 분량을 생산계획에서 삭제하시겠습니까?`, async ()=>{
    try{
      for(const planId of Object.keys(counts)){
        const { data: plan, error: pErr } = await sb.from('costco_production_plans').select('planned_pallet_count').eq('id', planId).single();
        if(pErr) throw pErr;
        const newCount = (plan.planned_pallet_count||0) - counts[planId];
        if(newCount<=0){
          await sb.from('costco_production_plans').delete().eq('id', planId);
        }else{
          await sb.from('costco_production_plans').update({ planned_pallet_count:newCount, updated_by:STATE.profile.id }).eq('id', planId);
        }
      }
      closeModal(); toast('선택한 항목이 삭제되었습니다.','ok'); switchTab('production');
    }catch(e){ toast(friendlyError(e),'err'); }
  }, {danger:true, confirmLabel:'선택 삭제'});
}
const debouncedPlanSearch = debounce((v)=>{ PLAN_FILTERS.q=v; switchTab('production'); }, 400);
function exportPlansCsv(){
  const rows = (STATE.cache.planShownRows||[]).map(p=>({
    계획번호:p.plan_no, 생산예정일:p.planned_production_date||'', 국가:countryName(p.country_id),
    파렛트유형:productName(p.product_id), 수량:p.planned_pallet_count, 생산담당자:p.production_manager||'', 상태:p.status
  }));
  csvDownload(`생산계획목록_${todayKST()}.csv`, rows);
}

async function openProductionPlanModal(planId){
  const existing = planId ? (STATE.cache.productionPlans||[]).find(x=>x.id===planId) : null;
  const body = `
    <div class="form-grid">
      <div class="field"><label>생산예정일 *</label><input type="date" id="plnDate" value="${existing?.planned_production_date||''}"></div>
      <div class="field"><label>국가 *</label>
        <select id="plnCountry">${activeCountries().map(c=>`<option value="${c.id}" ${existing&&existing.country_id===c.id?'selected':''}>${esc(c.country_name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>파렛트유형 *</label>
        <select id="plnProduct">${activeProducts().map(p=>`<option value="${p.id}" ${existing&&existing.product_id===p.id?'selected':''}>${esc(p.product_name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>생산수량(파렛트) *</label><input type="number" min="1" id="plnCount" value="${existing?existing.planned_pallet_count:1}"></div>
      <div class="field"><label>생산담당자</label><input type="text" id="plnManager" value="${esc(existing?.production_manager||'')}"></div>
      <div class="field full"><label>비고</label><input type="text" id="plnNotes" value="${esc(existing?.notes||'')}"></div>
    </div>`;
  openModal(planId?'생산계획 수정':'생산계획 등록', body, [
    { label:'취소', cls:'btn-ghost', onClick: closeModal },
    { label:'저장', cls:'btn-primary', onClick: ()=>saveProductionPlan(planId) }
  ]);
}
async function saveProductionPlan(planId){
  const qty = parseInt(document.getElementById('plnCount').value)||0;
  const date = document.getElementById('plnDate').value;
  if(!date){ toast('생산예정일을 입력해 주세요.','err'); return; }
  if(qty<1){ toast('생산수량을 입력해 주세요.','err'); return; }
  const payload = {
    planned_production_date: date,
    country_id: document.getElementById('plnCountry').value,
    product_id: document.getElementById('plnProduct').value,
    planned_pallet_count: qty,
    production_manager: document.getElementById('plnManager').value.trim() || null,
    notes: document.getElementById('plnNotes').value.trim() || null,
    updated_by: STATE.profile.id,
  };
  try{
    if(planId){
      const { error } = await sb.from('costco_production_plans').update(payload).eq('id', planId);
      if(error) throw error;
    }else{
      payload.created_by = STATE.profile.id;
      const { error } = await sb.from('costco_production_plans').insert(payload);
      if(error) throw error;
    }
    closeModal(); toast('생산계획이 저장되었습니다.','ok'); switchTab('production');
  }catch(e){ toast(friendlyError(e),'err'); }
}
function deleteProductionPlan(planId){
  confirmModal('이 생산계획을 삭제하시겠습니까?\n이미 이 계획으로 생성된 파렛트가 있으면 삭제할 수 없습니다.', async ()=>{
    try{
      const { error } = await sb.from('costco_production_plans').delete().eq('id', planId);
      if(error) throw error;
      closeModal(); toast('생산계획이 삭제되었습니다.','ok'); switchTab('production');
    }catch(e){ toast(friendlyError(e),'err'); }
  }, {danger:true, confirmLabel:'삭제'});
}

async function retractProductionPlanUnit(planId){
  if(!can('admin','production_manager','shipping_manager')){ toast('생산완료 회수 권한이 없습니다.','err'); return; }
  try{
    const { data: plan, error: pErr } = await sb.from('costco_production_plans').select('*').eq('id', planId).single();
    if(pErr) throw pErr;
    if(plan.status!=='생산완료'){ toast('생산완료 상태인 계획만 회수할 수 있습니다.','err'); return; }
    const { data: linkedPallets, error: lErr } = await sb.from('costco_pallets').select('id, pallet_no, status').eq('production_plan_id', planId).is('deleted_at', null);
    if(lErr) throw lErr;
    const used = (linkedPallets||[]).filter(p=>p.status!=='재고보유');
    if(used.length){
      toast(`이미 매칭/출고 등으로 재고가 사용된 파렛트(${used.map(p=>p.pallet_no).join(', ')})가 있어 회수할 수 없습니다.`,'err');
      return;
    }
    if(!confirm(`계획번호 ${plan.plan_no} (${(linkedPallets||[]).length}개 파렛트)을(를) 생산완료 전으로 되돌리시겠습니까?\n생성된 파렛트는 삭제되고, 계획은 다시 '계획중' 상태가 됩니다.`)) return;

    if(linkedPallets && linkedPallets.length){
      const { data: pd, error: dErr } = await sb.from('costco_pallets').update({
        deleted_at: new Date().toISOString(), updated_by: STATE.profile.id,
      }).in('id', linkedPallets.map(p=>p.id)).select();
      if(dErr) throw dErr;
      if(!pd || pd.length !== linkedPallets.length){ toast('파렛트 삭제 권한이 없어 회수가 반영되지 않았습니다. 관리자에게 DB 권한 확인을 요청해 주세요.','err'); return; }
    }
    const { data, error } = await sb.from('costco_production_plans').update({
      status:'계획중', confirmed_at:null, confirmed_by:null, updated_by: STATE.profile.id,
    }).eq('id', planId).select();
    if(error) throw error;
    if(!data || data.length===0){ toast('저장 권한이 없어 반영되지 않았습니다. 관리자에게 DB 권한 확인을 요청해 주세요.','err'); return; }
    toast('생산완료가 회수되어 계획중 상태로 되돌아갔습니다.','ok');
    switchTab('production');
  }catch(e){ toast(friendlyError(e),'err'); }
}
function confirmProductionPlanUnit(planId){
  processProductionCompletion({ [planId]: 1 });
}
function confirmSelectedPlanUnits(){
  const checked = [...document.querySelectorAll('.planUnitChk:checked')].map(c=>c.value);
  if(!checked.length){ toast('생산완료할 항목을 선택해 주세요.','err'); return; }
  const counts = {};
  checked.forEach(id=>{ counts[id] = (counts[id]||0) + 1; });
  processProductionCompletion(counts);
}
async function processProductionCompletion(unitCounts){
  const planIds = Object.keys(unitCounts);
  if(planIds.some(id=>INFLIGHT_PLAN_IDS.has(id))){ toast('이미 처리 중인 계획이 포함되어 있습니다. 잠시만 기다려 주세요.','err'); return; }
  planIds.forEach(id=>INFLIGHT_PLAN_IDS.add(id));
  try{
    const specs = [];
    const targetPlanIds = [];
    for(const planId of planIds){
      const { data: plan, error: pErr } = await sb.from('costco_production_plans').select('*').eq('id', planId).single();
      if(pErr) throw pErr;
      if(plan.status!=='계획중'){ toast(`${plan.plan_no}은(는) 이미 처리되었거나 계획중 상태가 아닙니다.`,'err'); return; }
      const { data: existing, error: exErr } = await sb.from('costco_pallets').select('id').eq('production_plan_id', planId).is('deleted_at', null);
      if(exErr) throw exErr;
      if(existing && existing.length){ toast(`${plan.plan_no}은(는) 이미 생성된 파렛트가 있습니다. 재고관리에서 확인해 주세요.`,'err'); return; }

      const want = Math.min(unitCounts[planId], plan.planned_pallet_count||0);
      if(want<1) continue;
      let targetPlan = plan;
      if(want < plan.planned_pallet_count){
        // 선택한 수량만큼 새 계획으로 분할
        const { data: newPlan, error: nErr } = await sb.from('costco_production_plans').insert({
          planned_production_date: plan.planned_production_date,
          country_id: plan.country_id,
          product_id: plan.product_id,
          planned_pallet_count: want,
          production_manager: plan.production_manager,
          notes: plan.notes,
          status: '계획중',
          created_by: STATE.profile.id,
        }).select().single();
        if(nErr) throw nErr;
        const { error: uErr } = await sb.from('costco_production_plans').update({
          planned_pallet_count: plan.planned_pallet_count - want, updated_by: STATE.profile.id
        }).eq('id', plan.id);
        if(uErr) throw uErr;
        targetPlan = newPlan;
      }
      const product = STATE.products.find(x=>x.id===targetPlan.product_id);
      const qty = product?.default_pallet_quantity;
      if(!qty){
        toast(`"${product?product.product_name:'이 파렛트유형'}"에 기본 파렛트 수량이 설정되어 있지 않습니다. 기준정보 > 파렛트유형에서 먼저 설정해 주세요.`,'err');
        await switchTab('master'); MASTER_VIEW='products'; await renderMaster();
        return;
      }
      const palletNos = await palletNumbersForBatch(targetPlan);
      palletNos.forEach(no=>{
        specs.push({
          pallet_no: no, production_plan_id: targetPlan.id, country_id: targetPlan.country_id, product_id: targetPlan.product_id,
          actual_quantity: qty, production_date: targetPlan.planned_production_date, created_by: STATE.profile.id,
        });
      });
      targetPlanIds.push(targetPlan.id);
    }
    if(!specs.length){ toast('생산완료할 수량이 없습니다.','err'); return; }
    openPalletCreationModal(specs, targetPlanIds);
  }catch(e){ toast(friendlyError(e),'err'); }
  finally{ planIds.forEach(id=>INFLIGHT_PLAN_IDS.delete(id)); }
}

/* ---------- 파렛트 생성 + 일련번호 일괄입력 (전체저장 시에만 실제 생성) ---------- */
let PALLET_CREATE_SPECS = null;
let PALLET_CREATE_PLAN_IDS = null;
let PALLET_CREATE_DATA = null;

function openPalletCreationModal(specs, planIds){
  PALLET_CREATE_SPECS = specs;
  PALLET_CREATE_PLAN_IDS = Array.isArray(planIds) ? planIds : (planIds ? [planIds] : []);
  PALLET_CREATE_DATA = specs.map(sp=>({ pallet_no: sp.pallet_no, actual_quantity: sp.actual_quantity, lots: [] }));
  const body = `<p class="helper-text" style="margin-bottom:10px;">모든 파렛트의 일련번호를 입력하고 저장해야 파렛트가 생성되며 해당 계획이 "생산완료"로 확정됩니다.</p><div id="palletCreateBox"></div>`;
  openModal(`일련번호 입력 (${PALLET_CREATE_DATA.length}개 파렛트)`, body, [
    { label:'닫기', cls:'btn-ghost', onClick: ()=>{ PALLET_CREATE_SPECS=null; PALLET_CREATE_PLAN_IDS=null; closeModal(); switchTab('production'); } },
    { label:'전체 저장', cls:'btn-primary', onClick: savePalletCreation }
  ], true, true);
  renderPalletCreateBox();
}
function renderPalletCreateBox(){
  const box = document.getElementById('palletCreateBox');
  if(!box) return;
  box.innerHTML = PALLET_CREATE_DATA.map((p, pIdx)=>{
    const visible = p.lots.map((l,idx)=>({l,idx})).filter(x=>!x.l._deleted);
    const sum = visible.reduce((a,x)=>a+(parseInt(x.l.quantity)||0),0);
    const ok = sum === p.actual_quantity;
    return `
      <div class="item-row-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <b>${esc(p.pallet_no)} <span class="helper-text">· 파렛트 수량 ${p.actual_quantity}</span></b>
          <button class="btn btn-ghost btn-sm" onclick="addPalletCreateLotRow(${pIdx})">+ 일련번호 추가</button>
        </div>
        ${visible.length? visible.map(({l,idx})=>`
          <div class="lot-row">
            <input type="text" placeholder="일련번호" value="${esc(l.serial_no)}" onchange="updatePalletCreateLotRow(${pIdx},${idx},'serial_no',this.value)">
            <input type="number" min="0" placeholder="수량" value="${l.quantity}" onchange="updatePalletCreateLotRow(${pIdx},${idx},'quantity',parseInt(this.value)||0)">
            <button class="btn btn-danger btn-sm" onclick="removePalletCreateLotRow(${pIdx},${idx})">삭제</button>
          </div>`).join('') : `<div class="helper-text">등록된 일련번호가 없습니다.</div>`}
        <div class="lot-sum">합계: <b style="color:${ok?'var(--green)':'var(--red)'}">${sum}</b> / 파렛트 수량: <b>${p.actual_quantity}</b> ${ok?'✅ 일치':'⚠️ 불일치'}</div>
      </div>`;
  }).join('');
}
function addPalletCreateLotRow(pIdx){
  PALLET_CREATE_DATA[pIdx].lots.push({serial_no:'', quantity:0, _deleted:false});
  renderPalletCreateBox();
}
function updatePalletCreateLotRow(pIdx, idx, field, value){
  PALLET_CREATE_DATA[pIdx].lots[idx][field] = value;
  renderPalletCreateBox();
}
function removePalletCreateLotRow(pIdx, idx){
  PALLET_CREATE_DATA[pIdx].lots.splice(idx,1);
  renderPalletCreateBox();
}
async function savePalletCreation(){
  for(const p of PALLET_CREATE_DATA){
    const visible = p.lots.filter(l=>!l._deleted);
    const sum = visible.reduce((a,l)=>a+(parseInt(l.quantity)||0),0);
    if(!visible.length || sum !== p.actual_quantity){
      toast(`${p.pallet_no}의 일련번호 수량 합계(${sum})가 파렛트 수량(${p.actual_quantity})과 일치하지 않습니다.`,'err');
      return;
    }
  }
  try{
    const insertRows = PALLET_CREATE_SPECS.map(sp=>({ ...sp, status:'재고보유' }));
    const { data: inserted, error } = await sb.from('costco_pallets').insert(insertRows).select('id, pallet_no');
    if(error) throw error;
    const idByNo = {};
    (inserted||[]).forEach(r=>{ idByNo[r.pallet_no] = r.id; });
    for(const p of PALLET_CREATE_DATA){
      const pid = idByNo[p.pallet_no];
      if(!pid) continue;
      for(const l of p.lots){
        if(l._deleted || !l.serial_no) continue;
        const { error: lotErr } = await sb.from('costco_pallet_lots').insert({
          pallet_id: pid, serial_no: l.serial_no, quantity: l.quantity||0, created_by: STATE.profile.id,
        });
        if(lotErr) throw lotErr;
      }
      const expDates = [...new Set(p.lots.filter(l=>!l._deleted && l.serial_no).map(l=>computeExpirationFromSerial(l.serial_no)).filter(Boolean))].sort();
      if(expDates[0]){
        await sb.from('costco_pallets').update({expiration_date: expDates[0]}).eq('id', pid);
      }
    }
    if(PALLET_CREATE_PLAN_IDS && PALLET_CREATE_PLAN_IDS.length){
      const { error: planErr } = await sb.from('costco_production_plans').update({
        status:'생산완료', confirmed_at:new Date().toISOString(), confirmed_by:STATE.profile.id, updated_by:STATE.profile.id
      }).in('id', PALLET_CREATE_PLAN_IDS);
      if(planErr) throw planErr;
    }
    PALLET_CREATE_SPECS = null; PALLET_CREATE_PLAN_IDS = null;
    closeModal();
    toast('파렛트가 생성되고 일련번호 입력이 완료되어 생산완료로 확정되었습니다.','ok');

    const producedKeys = new Set(insertRows.map(sp=>sp.product_id+'|'+sp.country_id));
    const { data: openOrders } = await sb.from('costco_orders').select('id, product_id, country_id, planned_pallet_count').neq('status','취소');
    const { data: allPallets } = await sb.from('costco_pallets').select('order_id, status').is('deleted_at', null);
    const hasMatchable = (openOrders||[]).some(o=>{
      if(!producedKeys.has(o.product_id+'|'+o.country_id)) return false;
      const linked = (allPallets||[]).filter(p=>p.order_id===o.id && p.status!=='취소');
      const reserved = linked.filter(p=>p.status==='매칭완료'||p.status==='출고완료').length;
      return reserved < (o.planned_pallet_count||0);
    });
    await switchTab('inventory');
    if(hasMatchable){
      confirmModal('매칭 할 발주건이 있습니다. 출고관리로 이동하시겠습니까?', async ()=>{
        closeModal(); switchTab('dispatch');
      });
    }
  }catch(e){ toast(friendlyError(e),'err'); }
}
</script>
<script>
/* ============================================================
   재고관리
   ============================================================ */
let INV_FILTERS = { status:'재고보유', productId:'', countryId:'', q:'' };

  if(INV_FILTERS.countryId) rows = rows.filter(p=>p.country_id===INV_FILTERS.countryId);
  if(INV_FILTERS.q){
    const q = INV_FILTERS.q.toLowerCase();
    rows = rows.filter(p=>(p.pallet_no||'').toLowerCase().includes(q) ||
      (p.costco_pallet_lots||[]).some(l=>(l.serial_no||'').toLowerCase().includes(q)));
  }

  const html = `
    <div class="panel">

      <div class="panel-body pad0"><div class="table-wrap"><table>

        `).join('') : `<tr><td colspan="3" class="empty-row">보유 재고가 없습니다.</td></tr>`}
        </tbody>

          <button class="btn ${INV_FILTERS.status==='재고보유'?'btn-primary':'btn-ghost'} btn-sm" onclick="INV_FILTERS.status='재고보유'; switchTab('inventory')">여유재고</button>
          <button class="btn ${INV_FILTERS.status==='매칭완료'?'btn-primary':'btn-ghost'} btn-sm" onclick="INV_FILTERS.status='매칭완료'; switchTab('inventory')">매칭완료</button>
          <button class="btn ${INV_FILTERS.status==='출고완료'?'btn-primary':'btn-ghost'} btn-sm" onclick="INV_FILTERS.status='출고완료'; switchTab('inventory')">출고완료</button>

async function deleteInventoryPallet(palletId){
  if(!can('admin')){ toast('파렛트 삭제는 관리자만 가능합니다.','err'); return; }
  const pallet = (STATE.cache.pallets||[]).find(x=>x.id===palletId);

  if(!confirm(`파렛트 ${pallet?pallet.pallet_no:''} 을(를) 삭제하시겠습니까?\n삭제 후에는 재고 목록/이력에서 더 이상 조회되지 않습니다.`)) return;

  if(pw!=='486'){ toast('비밀번호가 일치하지 않아 삭제가 취소되었습니다.','err'); return; }
  try{
    const { data, error } = await sb.from('costco_pallets').update({
      deleted_at: new Date().toISOString(), updated_by: STATE.profile.id,
    }).eq('id', palletId).eq('status','재고보유').select();
    if(error) throw error;
    if(!data || data.length===0){ toast('삭제 권한이 없거나 이미 상태가 변경되어 반영되지 않았습니다.','err'); return; }
    toast('파렛트가 삭제되었습니다.','ok');
    switchTab('inventory');
  }catch(e){ toast(friendlyError(e),'err'); }
}

          <option value="출고완료" ${p.status==='출고완료'?'selected':''} ${p.status!=='출고완료'?'disabled':''}>출고완료 (출고관리에서 변경)</option>
          <option value="품질보류" ${p.status==='품질보류'?'selected':''}>품질보류</option>
          <option value="취소" ${p.status==='취소'?'selected':''}>취소</option>
        </select>
      </div>
      <div class="field"><label>생산일</label><input type="date" id="ivProdDate" value="${p.production_date||''}"></div>
      <div class="field"><label>소비기한</label><input type="date" id="ivExpDate" value="${p.expiration_date||''}">
        <div class="helper-text">일련번호가 생산일자(YYYYMMDD)를 담고 있으면 저장 시 자동 계산됩니다.</div>
      </div>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <b style="font-size:13.5px;">일련번호</b>
      <button class="btn btn-ghost btn-sm" onclick="addInvLotRow()">+ 일련번호 추가</button>
    </div>
    <div id="ivLotBox"></div>
    <div class="lot-sum" id="ivLotSum"></div>
  `;
  openModal('파렛트 수정', body, [
    { label:'취소', cls:'btn-ghost', onClick: closeModal },
    { label:'저장', cls:'btn-primary', onClick: ()=>saveInventoryPallet(palletId) }
  ], true);
  renderInvLotRows();
  document.getElementById('ivQty').addEventListener('input', renderInvLotSum);
}
let INV_LOT_ROWS = [];
function addInvLotRow(){ INV_LOT_ROWS.push({id:null, serial_no:'', quantity:0, _deleted:false}); renderInvLotRows(); }
function updateInvLotRow(idx, field, value){ INV_LOT_ROWS[idx][field]=value; renderInvLotSum(); }
function removeInvLotRow(idx){
  const row = INV_LOT_ROWS[idx];
  if(row.id) row._deleted = true; else INV_LOT_ROWS.splice(idx,1);
  renderInvLotRows();
}
function renderInvLotRows(){
  const box = document.getElementById('ivLotBox');
  const visible = INV_LOT_ROWS.map((r,idx)=>({r,idx})).filter(x=>!x.r._deleted);
  box.innerHTML = visible.length ? visible.map(({r,idx})=>`
    <div class="lot-row">
      <input type="text" placeholder="일련번호" value="${esc(r.serial_no)}" onchange="updateInvLotRow(${idx},'serial_no',this.value)">
      <input type="number" min="0" placeholder="수량" value="${r.quantity}" onchange="updateInvLotRow(${idx},'quantity',parseInt(this.value)||0)">
      <button class="btn btn-danger btn-sm" onclick="removeInvLotRow(${idx})">삭제</button>
    </div>`).join('') : `<div class="helper-text">등록된 일련번호가 없습니다.</div>`;
  renderInvLotSum();
}
function renderInvLotSum(){
  const box = document.getElementById('ivLotSum');
  const qty = parseInt(document.getElementById('ivQty')?.value)||0;
  const sum = INV_LOT_ROWS.filter(r=>!r._deleted).reduce((a,r)=>a+(parseInt(r.quantity)||0),0);
  if(box) box.innerHTML = `합계: <b style="color:${sum===qty?'var(--green)':'var(--red)'}">${sum}</b> / 파렛트 수량: <b>${qty}</b> ${sum===qty?'✅ 일치':'⚠️ 불일치'}`;
}
async function saveInventoryPallet(palletId){
  const qty = parseInt(document.getElementById('ivQty').value)||0;
  const status = document.getElementById('ivStatus').value;
  const visibleLots = INV_LOT_ROWS.filter(r=>!r._deleted);
  const lotSum = visibleLots.reduce((a,r)=>a+(parseInt(r.quantity)||0),0);
  if(status!=='취소'){
    if(!visibleLots.length){ toast('일련번호를 입력해야 저장할 수 있습니다.','err'); return; }
    if(lotSum !== qty){ toast(`일련번호 수량 합계(${lotSum})가 파렛트 수량(${qty})과 일치해야 저장할 수 있습니다.`,'err'); return; }
  }
  const expDates = [...new Set(visibleLots.filter(r=>r.serial_no).map(r=>computeExpirationFromSerial(r.serial_no)).filter(Boolean))].sort();
  const computedExp = expDates[0] || null;
  const payload = {
    actual_quantity: qty,
    status,
    production_date: document.getElementById('ivProdDate').value || null,
    expiration_date: computedExp || document.getElementById('ivExpDate').value || null,
    updated_by: STATE.profile.id,
  };
  try{
    const { error } = await sb.from('costco_pallets').update(payload).eq('id', palletId);
    if(error) throw error;
    for(const r of INV_LOT_ROWS){
      if(r._deleted && r.id){ await sb.from('costco_pallet_lots').delete().eq('id', r.id); continue; }
      if(r._deleted) continue;
      if(r.id){
        await sb.from('costco_pallet_lots').update({ serial_no:r.serial_no, quantity:r.quantity||0 }).eq('id', r.id);
      }else{
        await sb.from('costco_pallet_lots').insert({ pallet_id:palletId, serial_no:r.serial_no, quantity:r.quantity||0, created_by:STATE.profile.id });
      }
    }
    closeModal(); toast('파렛트 정보가 저장되었습니다.','ok'); switchTab('inventory');
  }catch(e){ toast(friendlyError(e),'err'); }
}
</script>
<script>
/* ============================================================
   출고관리
   ============================================================ */
let DISPATCH_FILTERS = { periodMode:'month', from: todayKST().slice(0,7)+'-01', to: lastDayOfMonthISO(todayKST().slice(0,7)), q:'' };
let DISPATCH_VIEW = 'progress';

async function renderDispatch(){
  const [orders, pallets] = await Promise.all([ loadOrdersFull(DISPATCH_FILTERS.from||null, DISPATCH_FILTERS.to||null), loadPalletsFull({}) ]);
  const activeOrders = orders.filter(o=>o.status!=='취소');
  STATE.cache.orders = orders;
  STATE.cache.pallets = pallets;
  const canManage = can('admin','shipping_manager','production_manager');

  let rows = activeOrders.map(o=>{
    const linked = pallets.filter(p=>p.order_id===o.id && p.status!=='취소');
    const matched = linked.filter(p=>p.status==='매칭완료').length;
    const dispatched = linked.filter(p=>p.status==='출고완료').length;
    return { o, matched, dispatched, status: orderStatusOf(o, pallets) };
  });
  if(DISPATCH_FILTERS.q){
    const q = DISPATCH_FILTERS.q.toLowerCase();
    rows = rows.filter(r=>(r.o.order_no||'').toLowerCase().includes(q));
  }
  rows.sort((a,b)=> (a.o.planned_ship_date||'') < (b.o.planned_ship_date||'') ? -1 : 1);
  const progressRows = rows.filter(r=>r.status!=='출고완료');
  const doneRows = rows.filter(r=>r.status==='출고완료');
  const shownRows = DISPATCH_VIEW==='done' ? doneRows : progressRows;
  STATE.cache.dispatchShownRows = shownRows;

  const html = `
    <div class="panel">
      <div class="panel-head">
        <h3>발주 목록</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn ${DISPATCH_VIEW==='progress'?'btn-primary':'btn-ghost'} btn-sm" onclick="DISPATCH_VIEW='progress'; switchTab('dispatch')">진행중 (${progressRows.length})</button>
          <button class="btn ${DISPATCH_VIEW==='done'?'btn-primary':'btn-ghost'} btn-sm" onclick="DISPATCH_VIEW='done'; switchTab('dispatch')">출고완료 (${doneRows.length})</button>
        </div>
      </div>
      <div class="panel-head" style="border-top:1px solid var(--line);">
        <div class="toolbar">
          ${periodPickerHtml(DISPATCH_FILTERS, 'dispatch', 'DISPATCH_FILTERS')}
          <input type="text" placeholder="발주번호 검색" value="${esc(DISPATCH_FILTERS.q)}" oninput="debouncedDispatchSearch(this.value)">
          ${canManage?`<button class="btn btn-primary btn-sm" onclick="autoMatchAll()">자동매칭</button>`:''}
          <button class="btn btn-ghost btn-sm" onclick="exportDispatchCsv()">CSV 다운로드</button>
        </div>
      </div>
      <div class="panel-body pad0"><div class="table-wrap"><table>
        <thead><tr><th>발주번호</th><th>출고예정일</th><th>파렛트유형</th><th>국가</th><th>납품처</th><th>발주수량</th><th>매칭</th><th>출고완료</th><th>상태</th><th></th></tr></thead>
        <tbody>
        ${shownRows.length? shownRows.map(r=>`
          <tr>
            <td>${esc(r.o.order_no)}</td>
            <td>${fmtDateDisp(r.o.planned_ship_date)}</td>
            <td>${esc(productName(r.o.product_id))}</td>
            <td>${esc(countryName(r.o.country_id))}</td>
            <td>${esc(destinationName(r.o.destination_id))}</td>
            <td>${r.o.planned_pallet_count}</td>
            <td>${r.matched}</td>
            <td>${r.dispatched}</td>
            <td>${orderStatusBadge(r.status)}</td>
            <td>${canManage?`<button class="btn btn-ghost btn-sm" onclick="openDispatchDetailModal('${r.o.id}','match')">수동매칭</button>
              <button class="btn btn-ghost btn-sm" onclick="autoMatchOne('${r.o.id}')">자동매칭</button>
              <button class="btn btn-primary btn-sm" onclick="openDispatchDetailModal('${r.o.id}','dispatch')">출고완료</button>`:''}</td>
          </tr>`).join('') : `<tr><td colspan="10" class="empty-row">조건에 맞는 발주가 없습니다.</td></tr>`}
        </tbody>
      </table></div></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}
const debouncedDispatchSearch = debounce((v)=>{ DISPATCH_FILTERS.q=v; switchTab('dispatch'); }, 400);
function autoMatchAll(){
  confirmModal('출고예정일이 빠른 발주부터, 오래된 재고 순으로 자동 매칭하시겠습니까?', async ()=>{
    try{
      const [orders, pallets] = await Promise.all([ loadOrdersFull(null, null), loadPalletsFull({}) ]);
      const activeOrders = orders.filter(o=>o.status!=='취소');
      const pendingOrders = activeOrders
        .filter(o=>orderStatusOf(o, pallets)!=='출고완료' && orderStatusOf(o, pallets)!=='출고대기')
        .sort((a,b)=> (a.planned_ship_date||'') < (b.planned_ship_date||'') ? -1 : 1);

      const freePool = pallets.filter(p=>p.status==='재고보유')
        .sort((a,b)=> (a.production_date||a.created_at||'') < (b.production_date||b.created_at||'') ? -1 : 1);

      const updates = [];
      let matchedOrderCount = 0;
      for(const o of pendingOrders){
        const cov = orderCoverage(o, pallets);
        let remain = (o.planned_pallet_count||0) - cov.reserved;
        if(remain<=0) continue;
        const take = [];
        for(let i=0;i<freePool.length && remain>0;i++){
          const p = freePool[i];
          if(p._taken) continue;
          if(p.product_id===o.product_id && p.country_id===o.country_id){
            p._taken = true;
            take.push(p.id);
            remain--;
          }
        }
        if(take.length){
          updates.push({ orderId: o.id, palletIds: take });
          matchedOrderCount++;
        }
      }
      if(!updates.length){ closeModal(); toast('매칭할 수 있는 발주나 재고가 없습니다.','err'); return; }

      let totalMatched = 0;
      for(const u of updates){
        const { error } = await sb.from('costco_pallets').update({ order_id:u.orderId, status:'매칭완료', updated_by:STATE.profile.id }).in('id', u.palletIds);
        if(error) throw error;
        totalMatched += u.palletIds.length;
      }
      closeModal(); toast(`발주 ${matchedOrderCount}건에 파렛트 ${totalMatched}개를 자동 매칭했습니다.`,'ok'); switchTab('dispatch');
    }catch(e){ toast(friendlyError(e),'err'); }
  });
}
async function autoMatchOne(orderId){
  try{
    const [orders, pallets] = await Promise.all([ loadOrdersFull(null, null), loadPalletsFull({}) ]);
    const o = orders.find(x=>x.id===orderId);
    if(!o){ toast('발주를 찾을 수 없습니다.','err'); return; }
    const cov = orderCoverage(o, pallets);
    let remain = (o.planned_pallet_count||0) - cov.reserved;
    if(remain<=0){ toast('이미 매칭이 완료된 발주입니다.','err'); return; }
    const freePool = pallets.filter(p=>p.status==='재고보유' && p.product_id===o.product_id && p.country_id===o.country_id)
      .sort((a,b)=> (a.production_date||a.created_at||'') < (b.production_date||b.created_at||'') ? -1 : 1);
    const take = freePool.slice(0, remain).map(p=>p.id);
    if(!take.length){ toast('매칭 가능한 재고가 없습니다.','err'); return; }
    const { error } = await sb.from('costco_pallets').update({ order_id:orderId, status:'매칭완료', updated_by:STATE.profile.id }).in('id', take);
    if(error) throw error;
    toast(`파렛트 ${take.length}개를 자동 매칭했습니다.`,'ok'); switchTab('dispatch');
  }catch(e){ toast(friendlyError(e),'err'); }
}
function exportDispatchCsv(){
  const rows = (STATE.cache.dispatchShownRows||[]).map(r=>({
    발주번호:r.o.order_no, 출고예정일:r.o.planned_ship_date||'', 파렛트유형:productName(r.o.product_id),
    국가:countryName(r.o.country_id), 납품처:destinationName(r.o.destination_id),
    발주수량:r.o.planned_pallet_count, 매칭:r.matched, 출고완료:r.dispatched, 상태:r.status
  }));
  csvDownload(`출고관리목록_${todayKST()}.csv`, rows);
}

async function openDispatchDetailModal(orderId, mode){
  mode = mode || 'match';
  const o = (STATE.cache.orders||[]).find(x=>x.id===orderId);
  const { data: pallets, error } = await sb.from('costco_pallets').select('*, costco_pallet_lots(*)').is('deleted_at', null);
  if(error){ toast(friendlyError(error),'err'); return; }
  const matched = pallets.filter(p=>p.order_id===orderId && p.status==='매칭완료');
  const dispatched = pallets.filter(p=>p.order_id===orderId && p.status==='출고완료');
  const available = pallets.filter(p=>p.status==='재고보유' && p.product_id===o.product_id && p.country_id===o.country_id);
  let resvStatus = '미완료';
  if(mode==='dispatch'){
    const { data: resv } = await sb.from('costco_warehouse_reservations').select('reservation_status').eq('order_no', o.order_no).maybeSingle();
    resvStatus = resv ? resv.reservation_status : '미완료';
  }

  const body = `
    <p class="helper-text" style="margin-bottom:10px;">
      ${esc(o.order_no)} · ${esc(productName(o.product_id))} · ${esc(countryName(o.country_id))} · 발주수량 ${o.planned_pallet_count} · 매칭 ${matched.length} · 출고완료 ${dispatched.length}
    </p>
    ${mode==='dispatch' ? `
    <p style="margin-bottom:14px;">입고예약 상태: ${resvStatus==='예약완료'?'<span class="badge b-green">예약완료</span>':'<span class="badge b-amber">미완료 - 출고완료 처리 불가</span>'}</p>
    `:''}
    ${mode==='dispatch' && dispatched.length? `
    <b style="font-size:13.5px;">출고완료된 파렛트</b>
    <div style="margin:6px 0 6px;">
      ${dispatched.map(p=>`
        <label style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #f1f2f4;font-size:13px;">
          <input type="checkbox" class="dispatchedChk" value="${p.id}">
          <span>${esc(p.pallet_no)} · 생산일 ${fmtDateDisp(p.production_date)} · 소비기한 ${palletExpirationDisplay(p)} · LOT ${(p.costco_pallet_lots||[]).length}개</span>
        </label>`).join('')}
    </div>
    <button class="btn btn-danger btn-sm" style="margin-bottom:14px;" onclick="doCancelDispatchSelected('${orderId}')">선택 출고취소</button>
    `:''}
    <b style="font-size:13.5px;">매칭된 파렛트 ${mode==='dispatch'?'(출고 대상)':'(출고 대기)'}</b>
    <div style="margin:6px 0 14px;">
      ${matched.length? matched.map(p=>`
        <label style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #f1f2f4;font-size:13px;">
          <input type="checkbox" class="unmatchChk" value="${p.id}">
          <span>${esc(p.pallet_no)} · 생산일 ${fmtDateDisp(p.production_date)} · 소비기한 ${palletExpirationDisplay(p)} · LOT ${(p.costco_pallet_lots||[]).length}개</span>
        </label>`).join('') : `<div class="helper-text">매칭된 파렛트가 없습니다.</div>`}
      ${mode==='match' && matched.length?`<button class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="doUnmatchSelected('${orderId}')">선택 매칭해제</button>`:''}
    </div>
    ${mode==='match' ? `
    <b style="font-size:13.5px;">매칭 가능 재고 (같은 파렛트유형·국가)</b>
    <div style="margin:6px 0 10px;">
      ${available.length? available.map(p=>`
        <label style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #f1f2f4;font-size:13px;">
          <input type="checkbox" class="matchChk" value="${p.id}">
          <span>${esc(p.pallet_no)} · 생산일 ${fmtDateDisp(p.production_date)} · 소비기한 ${palletExpirationDisplay(p)} · LOT ${(p.costco_pallet_lots||[]).length}개</span>
        </label>`).join('') : `<div class="helper-text">매칭 가능한 재고가 없습니다.</div>`}
    </div>
    <button class="btn btn-primary btn-sm" onclick="doMatchSelected('${orderId}')">선택 매칭</button>
    ` : `
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0;">
    <div class="form-grid">
      <div class="field"><label>실제 출고일</label><input type="date" id="dspShipDate" value="${todayKST()}"></div>
      <div class="field"><label>출고 담당자</label><input type="text" id="dspManager" value="${esc(STATE.profile.name||'')}"></div>
    </div>
    `}
  `;
  const buttons = mode==='match'
    ? [{ label:'닫기', cls:'btn-ghost', onClick: ()=>{ closeModal(); switchTab('dispatch'); } }]
    : [
        { label:'닫기', cls:'btn-ghost', onClick: ()=>{ closeModal(); switchTab('dispatch'); } },
        { label:'출고완료 처리', cls:'btn-primary', onClick: ()=>doCompleteDispatch(orderId) }
      ];
  openModal(`${mode==='match'?'매칭 처리':'출고완료 처리'} - ${o.order_no}`, body, buttons, true);
}
async function doMatchSelected(orderId){
  const ids = [...document.querySelectorAll('.matchChk:checked')].map(c=>c.value);
  if(!ids.length){ toast('매칭할 재고를 선택해 주세요.','err'); return; }
  try{
    const { error } = await sb.from('costco_pallets').update({ order_id: orderId, status:'매칭완료', updated_by:STATE.profile.id }).in('id', ids);
    if(error) throw error;
    toast(`${ids.length}개 파렛트를 매칭했습니다.`,'ok');
    closeModal(); await openDispatchDetailModal(orderId);
  }catch(e){ toast(friendlyError(e),'err'); }
}
async function doUnmatchSelected(orderId){
  const ids = [...document.querySelectorAll('.unmatchChk:checked')].map(c=>c.value);
  if(!ids.length){ toast('매칭해제할 파렛트를 선택해 주세요.','err'); return; }
  try{
    const { error } = await sb.from('costco_pallets').update({ order_id: null, status:'재고보유', updated_by:STATE.profile.id }).in('id', ids);
    if(error) throw error;
    toast(`${ids.length}개 파렛트 매칭을 해제했습니다.`,'ok');
    closeModal(); await openDispatchDetailModal(orderId);
  }catch(e){ toast(friendlyError(e),'err'); }
}
function doCancelDispatchSelected(orderId){
  const ids = [...document.querySelectorAll('.dispatchedChk:checked')].map(c=>c.value);
  if(!ids.length){ toast('출고취소할 파렛트를 선택해 주세요.','err'); return; }
  confirmModal(`선택한 파렛트 ${ids.length}개를 출고취소 하시겠습니까?\n"매칭완료" 상태로 되돌아가며, 다시 출고완료 처리할 수 있습니다.`, async ()=>{
    try{
      const { data: links, error: lErr } = await sb.from('costco_dispatch_pallets').select('id, dispatch_id, pallet_id').in('pallet_id', ids);
      if(lErr) throw lErr;
      const dispatchIds = [...new Set((links||[]).map(l=>l.dispatch_id))];
      const linkIds = (links||[]).map(l=>l.id);
      if(linkIds.length){
        const { error: delErr } = await sb.from('costco_dispatch_pallets').delete().in('id', linkIds);
        if(delErr) throw delErr;
      }
      const { error: updErr } = await sb.from('costco_pallets').update({ status:'매칭완료', updated_by:STATE.profile.id }).in('id', ids);
      if(updErr) throw updErr;
      // 남은 연결이 없는 출고 기록은 취소 처리
      for(const dispId of dispatchIds){
        const { data: remaining } = await sb.from('costco_dispatch_pallets').select('id').eq('dispatch_id', dispId);
        if(!remaining || !remaining.length){
          await sb.from('costco_dispatches').update({ cancelled_at: new Date().toISOString(), cancellation_reason:'파렛트 출고취소' }).eq('id', dispId);
        }
      }
      closeModal(); toast(`${ids.length}개 파렛트를 출고취소했습니다.`,'ok');
      await openDispatchDetailModal(orderId, 'dispatch');
    }catch(e){ toast(friendlyError(e),'err'); }
  }, {danger:true, confirmLabel:'출고취소'});
}
async function doCompleteDispatch(orderId){
  const o = (STATE.cache.orders||[]).find(x=>x.id===orderId);
  const actual_ship_date = document.getElementById('dspShipDate').value;
  if(!actual_ship_date){ toast('실제 출고일을 입력해 주세요.','err'); return; }
  try{
    const { data: resv, error: rErr } = await sb.from('costco_warehouse_reservations').select('reservation_status').eq('order_no', o.order_no).maybeSingle();
    if(rErr) throw rErr;
    if(!resv || resv.reservation_status!=='예약완료'){
      toast('입고예약이 완료되지 않아 출고완료 처리할 수 없습니다. 입고예약관리에서 먼저 예약완료로 변경해 주세요.','err');
      return;
    }
    const { data: matched, error: mErr } = await sb.from('costco_pallets').select('id').eq('order_id', orderId).eq('status','매칭완료');
    if(mErr) throw mErr;
    if(!matched || !matched.length){ toast('매칭된 파렛트가 없어 출고완료 처리할 수 없습니다.','err'); return; }
    const { data: disp, error } = await sb.from('costco_dispatches').insert({
      order_id: orderId, actual_ship_date,
      shipping_manager: document.getElementById('dspManager').value.trim()||null,
      created_by: STATE.profile.id,
    }).select().single();
    if(error) throw error;
    const links = matched.map(p=>({ dispatch_id: disp.id, pallet_id: p.id }));
    const { error: linkErr } = await sb.from('costco_dispatch_pallets').insert(links);
    if(linkErr) throw linkErr;
    const { error: updErr } = await sb.from('costco_pallets').update({ status:'출고완료', updated_by:STATE.profile.id }).in('id', matched.map(p=>p.id));
    if(updErr) throw updErr;
    closeModal(); toast('출고완료 처리되었습니다.','ok'); switchTab('dispatch');
  }catch(e){ toast(friendlyError(e),'err'); }
}
</script>

      const orderIds = (orders||[]).map(o=>o.id);
      if(orderIds.length){
        const { data, error: pErr } = await sb.from('costco_pallets').select('*, costco_pallet_lots(*)').in('order_id', orderIds).is('deleted_at', null);

      const { data: dp, error } = await sb.from('costco_dispatches').select('id, actual_ship_date, costco_dispatch_pallets(pallet_id)').eq('actual_ship_date', q);

        if(pErr) throw pErr;
        pallets = data||[];

    (dispatchLinks||[]).forEach(l=>{ dispatchMap[l.pallet_id] = l.costco_dispatches?.actual_ship_date; });

    pallets.sort((a,b)=> a.pallet_no < b.pallet_no ? -1 : 1);

      return `
        <tr>

          <td>${esc(serials)}</td>
          <td>${esc(productName(p.product_id))}</td>

<script>
/* ============================================================
   분석
   ============================================================ */
let ANALYTICS_MONTHS = 6;
function lastNMonthKeys(n){
  const t = todayKST();
  const [y,m] = t.slice(0,7).split('-').map(Number);
  const keys = [];
  for(let i=n-1;i>=0;i--){
    let yy=y, mm=m-i;
    while(mm<1){ mm+=12; yy--; }
    keys.push(`${yy}-${String(mm).padStart(2,'0')}`);
  }
  return keys;
}
function lineChartSvg(months, values, color){
  const w = Math.max(520, months.length*80), h = 230, padL=44, padR=20, padT=20, padB=36;
  const max = Math.max(1, ...values);
  const xStep = (w-padL-padR) / Math.max(1, months.length-1);
  const yScale = v => padT + (h-padT-padB) * (1 - v/max);
  const points = values.map((v,i)=> `${padL+i*xStep},${yScale(v)}`).join(' ');
  const dots = values.map((v,i)=>`<circle cx="${padL+i*xStep}" cy="${yScale(v)}" r="4" fill="${color}"/>
    <text x="${padL+i*xStep}" y="${yScale(v)-10}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${v}</text>`).join('');
  const xLabels = months.map((m,i)=>`<text x="${padL+i*xStep}" y="${h-padB+18}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${m.slice(5)}월</text>`).join('');
  const gridY = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + (h-padT-padB)*(1-f);
    const val = Math.round(max*f);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#eef0f3" stroke-width="1"/>
      <text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink-soft)">${val}</text>`;
  }).join('');
  return `<div style="overflow-x:auto;"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      ${gridY}
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5"/>
      ${dots}
      ${xLabels}
    </svg></div>`;
}
function barChartSvg(months, seriesMap, keyIds, nameFn){
  if(!keyIds.length) return `<p class="helper-text" style="padding:12px 0;">표시할 데이터가 없습니다.</p>`;
  const w = Math.max(520, months.length*Math.max(70, keyIds.length*24)), h=250, padL=44, padR=20, padT=20, padB=54;
  const allVals = [];
  months.forEach(m=>keyIds.forEach(k=>allVals.push((seriesMap[m]&&seriesMap[m][k])||0)));
  const max = Math.max(1, ...allVals);
  const groupW = (w-padL-padR)/months.length;
  const barW = Math.min(30, groupW/(keyIds.length+1));
  const yScale = v => padT + (h-padT-padB)*(1-v/max);
  const bars = months.map((m,mi)=>{
    const groupX = padL + mi*groupW;
    return keyIds.map((k,ki)=>{
      const v = (seriesMap[m]&&seriesMap[m][k])||0;
      const x = groupX + ki*barW + (groupW - keyIds.length*barW)/2;
      const y = yScale(v);
      const barH = (h-padB) - y;
      return `<rect x="${x}" y="${y}" width="${Math.max(barW-3,2)}" height="${Math.max(barH,0)}" fill="${DONUT_COLORS[ki%DONUT_COLORS.length]}" rx="2"/>
        ${v>0?`<text x="${x+(barW-3)/2}" y="${y-4}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">${v}</text>`:''}`;
    }).join('');
  }).join('');
  const gridY = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + (h-padT-padB)*(1-f);
    const val = Math.round(max*f);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#eef0f3" stroke-width="1"/>
      <text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink-soft)">${val}</text>`;
  }).join('');
  const xLabels = months.map((m,mi)=>`<text x="${padL+mi*groupW+groupW/2}" y="${h-padB+18}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${m.slice(5)}월</text>`).join('');
  const totals = months.map(m=> keyIds.reduce((a,k)=>a+((seriesMap[m]&&seriesMap[m][k])||0),0));
  const trendPoints = totals.map((v,mi)=> `${padL+mi*groupW+groupW/2},${yScale(v)}`).join(' ');
  const trendDots = totals.map((v,mi)=>{
    const x = padL+mi*groupW+groupW/2, y = yScale(v);
    return `<circle cx="${x}" cy="${y}" r="4" fill="var(--red)" stroke="#fff" stroke-width="1.5"/>
      <text x="${x}" y="${y-10}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--red)">${v}</text>`;
  }).join('');
  const trendLine = `<polyline points="${trendPoints}" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="5 3"/>${trendDots}`;
  const legend = keyIds.map((k,ki)=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:11.5px;color:var(--ink-soft);"><span style="width:9px;height:9px;border-radius:2px;background:${DONUT_COLORS[ki%DONUT_COLORS.length]};display:inline-block;"></span>${esc(nameFn(k))}</span>`).join('')
    + `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:11.5px;color:var(--ink-soft);"><span style="width:14px;height:2px;background:var(--red);display:inline-block;"></span>합계 추이</span>`;
  return `<div style="overflow-x:auto;"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      ${gridY}${bars}${trendLine}${xLabels}
    </svg></div>
    <div style="margin-top:8px;">${legend}</div>`;
}
async function renderAnalytics(){
  const months = lastNMonthKeys(ANALYTICS_MONTHS);
  const rangeFrom = months[0]+'-01';
  const rangeTo = lastDayOfMonthISO(months[months.length-1]);

  const [dispatches, dispatchPallets, pallets, orders] = await Promise.all([
    sb.from('costco_dispatches').select('id, actual_ship_date, order_id').gte('actual_ship_date', rangeFrom).lte('actual_ship_date', rangeTo).then(r=>r.data||[]),
    sb.from('costco_dispatch_pallets').select('dispatch_id, pallet_id').then(r=>r.data||[]),
    sb.from('costco_pallets').select('id, product_id, country_id, production_date, status').is('deleted_at', null).then(r=>r.data||[]),
    sb.from('costco_orders').select('id, destination_id').then(r=>r.data||[]),
  ]);
  const palletById = {}; pallets.forEach(p=>palletById[p.id]=p);
  const orderById = {}; orders.forEach(o=>orderById[o.id]=o);
  const dispatchById = {}; dispatches.forEach(d=>dispatchById[d.id]=d);

  // 출고 집계
  const shipByMonth = {}, shipByMonthCountry = {}, shipByMonthProduct = {}, shipByMonthDest = {};
  dispatchPallets.forEach(dp=>{
    const d = dispatchById[dp.dispatch_id];
    if(!d || !d.actual_ship_date) return;
    const month = d.actual_ship_date.slice(0,7);
    if(!months.includes(month)) return;
    const p = palletById[dp.pallet_id];
    const o = orderById[d.order_id];
    shipByMonth[month] = (shipByMonth[month]||0)+1;
    if(p){
      shipByMonthCountry[month] = shipByMonthCountry[month]||{};
      shipByMonthCountry[month][p.country_id] = (shipByMonthCountry[month][p.country_id]||0)+1;
      shipByMonthProduct[month] = shipByMonthProduct[month]||{};
      shipByMonthProduct[month][p.product_id] = (shipByMonthProduct[month][p.product_id]||0)+1;
    }
    if(o){
      shipByMonthDest[month] = shipByMonthDest[month]||{};
      shipByMonthDest[month][o.destination_id] = (shipByMonthDest[month][o.destination_id]||0)+1;
    }
  });

  // 생산 집계 (파렛트 생산일 기준, 취소 제외)
  const prodByMonth = {}, prodByMonthCountry = {};
  pallets.filter(p=>p.status!=='취소' && p.production_date).forEach(p=>{
    const month = p.production_date.slice(0,7);
    if(!months.includes(month)) return;
    prodByMonth[month] = (prodByMonth[month]||0)+1;
    prodByMonthCountry[month] = prodByMonthCountry[month]||{};
    prodByMonthCountry[month][p.country_id] = (prodByMonthCountry[month][p.country_id]||0)+1;
  });

  const allCountryIds = [...new Set(pallets.map(p=>p.country_id).filter(Boolean))];
  const allProductIds = [...new Set(pallets.map(p=>p.product_id).filter(Boolean))];
  const allDestIds = [...new Set(orders.map(o=>o.destination_id).filter(Boolean))];
  const shipTotals = months.map(m=>shipByMonth[m]||0);
  const prodTotals = months.map(m=>prodByMonth[m]||0);

  const html = `
    <div class="panel">
      <div class="panel-head">
        <h3>조회 기간</h3>
        <div class="toolbar">
          <select onchange="ANALYTICS_MONTHS=parseInt(this.value); switchTab('analytics')">
            <option value="3" ${ANALYTICS_MONTHS===3?'selected':''}>최근 3개월</option>
            <option value="6" ${ANALYTICS_MONTHS===6?'selected':''}>최근 6개월</option>
            <option value="12" ${ANALYTICS_MONTHS===12?'selected':''}>최근 12개월</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>총 출고량 (월별 추이)</h3></div>
      <div class="panel-body">${lineChartSvg(months, shipTotals, 'var(--green)')}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>국가별 출고량</h3></div>
      <div class="panel-body">${barChartSvg(months, shipByMonthCountry, allCountryIds, countryName)}</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>총 생산량 (월별 추이)</h3></div>
      <div class="panel-body">${lineChartSvg(months, prodTotals, 'var(--blue)')}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>국가별 생산량</h3></div>
      <div class="panel-body">${barChartSvg(months, prodByMonthCountry, allCountryIds, countryName)}</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>파렛트유형별 출고량</h3></div>
      <div class="panel-body">${barChartSvg(months, shipByMonthProduct, allProductIds, productName)}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>납품처별 출고량</h3></div>
      <div class="panel-body">${barChartSvg(months, shipByMonthDest, allDestIds, destinationName)}</div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}
</script>
<script>
/* ============================================================
   이력조회
   ============================================================ */
let HISTORY_FILTERS = { periodMode:'month', table:'', action:'', from: todayKST().slice(0,7)+'-01', to: lastDayOfMonthISO(todayKST().slice(0,7)) };
const HISTORY_TABLE_LABEL = {
  costco_orders:'발주', costco_production_plans:'생산계획', costco_pallets:'파렛트',
  costco_pallet_lots:'일련번호', costco_warehouse_reservations:'입고예약', costco_dispatches:'출고',
};
const HISTORY_ACTION_LABEL = { INSERT:'등록', UPDATE:'수정', DELETE:'삭제' };

async function renderHistory(){
  if(!can('admin')){
    document.getElementById('content').innerHTML = `<div class="empty-state"><div class="ic">🔒</div>이력조회는 관리자만 접근할 수 있습니다.</div>`;
    return;
  }
  let q = sb.from('costco_audit_logs').select('*, costco_profiles(name, email)').order('created_at', {ascending:false}).limit(300);
  if(HISTORY_FILTERS.table) q = q.eq('table_name', HISTORY_FILTERS.table);
  if(HISTORY_FILTERS.action) q = q.eq('action_type', HISTORY_FILTERS.action);
  if(HISTORY_FILTERS.from) q = q.gte('created_at', HISTORY_FILTERS.from+'T00:00:00');
  if(HISTORY_FILTERS.to) q = q.lte('created_at', HISTORY_FILTERS.to+'T23:59:59');
  const [{ data: logs, error }, profileNames] = await Promise.all([q, loadProfileNameMap()]);
  if(error){ document.getElementById('content').innerHTML = `<div class="empty-state">${esc(friendlyError(error))}</div>`; return; }
  STATE.cache.historyLogs = logs;

  const html = `
    <div class="panel">
      <div class="panel-head">
        <h3>변경 이력</h3>
        <div class="toolbar">
          ${periodPickerHtml(HISTORY_FILTERS, 'history', 'HISTORY_FILTERS')}
          <select onchange="HISTORY_FILTERS.table=this.value; switchTab('history')">
            <option value="">전체 구분</option>
            ${Object.entries(HISTORY_TABLE_LABEL).map(([k,l])=>`<option value="${k}" ${HISTORY_FILTERS.table===k?'selected':''}>${l}</option>`).join('')}
          </select>
          <select onchange="HISTORY_FILTERS.action=this.value; switchTab('history')">
            <option value="">전체 작업</option>
            ${Object.entries(HISTORY_ACTION_LABEL).map(([k,l])=>`<option value="${k}" ${HISTORY_FILTERS.action===k?'selected':''}>${l}</option>`).join('')}
          </select>
          <button class="btn btn-ghost btn-sm" onclick="exportHistoryCsv()">CSV 다운로드</button>
        </div>
      </div>
      <div class="panel-body pad0"><div class="table-wrap"><table>
        <thead><tr><th>일시</th><th>작업자</th><th>구분</th><th>작업유형</th><th>변경 내용</th></tr></thead>
        <tbody>
        ${logs && logs.length? logs.map(l=>`
          <tr>
            <td>${new Date(l.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul', hour12:false})}</td>
            <td>${esc(l.costco_profiles?.name || l.costco_profiles?.email || '-')}</td>
            <td>${esc(HISTORY_TABLE_LABEL[l.table_name] || l.table_name)}</td>
            <td>${esc(HISTORY_ACTION_LABEL[l.action_type] || l.action_type)}</td>
            <td>${summarizeAuditChange(l, profileNames)}</td>
          </tr>`).join('') : `<tr><td colspan="5" class="empty-row">이력이 없습니다.</td></tr>`}
        </tbody>
      </table></div></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}
function exportHistoryCsv(){
  const profileNames = STATE.cache.profileNames || {};
  const rows = (STATE.cache.historyLogs||[]).map(l=>({
    일시: new Date(l.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul', hour12:false}),
    작업자: l.costco_profiles?.name || l.costco_profiles?.email || '-',
    구분: HISTORY_TABLE_LABEL[l.table_name] || l.table_name,
    작업유형: HISTORY_ACTION_LABEL[l.action_type] || l.action_type,
    변경내용: summarizeAuditChange(l, profileNames).replace(/<[^>]+>/g,''),
  }));
  csvDownload(`변경이력_${todayKST()}.csv`, rows);
}
const HISTORY_FIELD_LABEL = {
  costco_orders: {
    order_no:'발주번호', requested_delivery_date:'납품요청일', actual_delivery_date:'납품일', planned_ship_date:'출고예정일', country_id:'국가', destination_id:'납품처',
    product_id:'파렛트유형', planned_pallet_count:'발주수량', notes:'비고', status:'상태',
    production_confirmed:'발주확인', production_confirmed_by:'확인자', production_confirmed_at:'확인일시',
    pending_planned_ship_date:'변경요청(출고예정일)', pending_actual_delivery_date:'변경요청(납품일)',
    change_status:'변경승인상태', change_requested_by:'변경요청자', change_requested_at:'변경요청일시',
    change_rejected_by:'변경거절자', change_rejected_at:'변경거절일시',
  },
  costco_production_plans: {
    plan_no:'계획번호', planned_production_date:'생산예정일', planned_pallet_count:'계획수량',
    production_manager:'생산담당자', status:'상태', country_id:'국가', product_id:'파렛트유형',
  },
  costco_pallets: {
    pallet_no:'파렛트번호', status:'상태', order_id:'매칭발주', production_date:'생산일',
    country_id:'국가', product_id:'파렛트유형',
  },
  costco_pallet_lots: { serial_no:'LOT일련번호', quantity:'수량' },
  costco_warehouse_reservations: { reservation_status:'예약상태', order_no:'발주번호' },
  costco_dispatches: {
    actual_ship_date:'실제출고일', order_id:'발주', cancelled_at:'취소일시', cancellation_reason:'취소사유',
  },
};
const HISTORY_STATUS_BADGE_MAP = {
  '재고보유':'b-green','매칭완료':'b-amber','출고완료':'b-blue','품질보류':'b-red','취소':'b-navy',
  '계획중':'b-navy','생산완료':'b-blue','예약완료':'b-green','미완료':'b-amber',
};
function historyStatusChip(v){
  if(v===null || v===undefined || v==='') return '<span style="color:var(--ink-soft);">-</span>';
  const cls = HISTORY_STATUS_BADGE_MAP[v];
  return cls ? `<span class="badge ${cls}" style="font-size:11px;">${esc(v)}</span>` : esc(String(v));
}
function historyFieldLabel(table, key){
  return (HISTORY_FIELD_LABEL[table]||{})[key] || key;
}
function historyFormatValue(table, key, value, profileNames){
  if(value===null || value===undefined || value==='') return '-';
  if(key.endsWith('_by') && profileNames){
    return esc(profileNames[value] || '(알 수 없음)');
  }
  if(key.endsWith('_at') || key.includes('date')){
    const d = String(value).slice(0,10);
    return /^\d{4}-\d{2}-\d{2}$/.test(d) ? fmtDateDisp(d) : esc(String(value));
  }
  if(typeof value==='boolean') return value ? '예' : '아니오';
  if(key==='country_id') return esc(countryName(value));
  if(key==='product_id') return esc(productName(value));
  if(key==='destination_id') return esc(destinationName(value));
  return esc(String(value));
}
function historyRowLabel(table, data){
  if(!data) return '';
  if(table==='costco_orders') return data.order_no || '';
  if(table==='costco_production_plans') return data.plan_no || '';
  if(table==='costco_pallets') return data.pallet_no || '';
  if(table==='costco_pallet_lots') return data.serial_no || '';
  if(table==='costco_warehouse_reservations') return data.order_no || '';
  if(table==='costco_dispatches') return data.actual_ship_date || '';
  return '';
}
function summarizeAuditChange(log, profileNames){
  const table = log.table_name;
  const rowLabel = historyRowLabel(table, log.new_data || log.old_data);
  const prefix = rowLabel ? `<b>${esc(rowLabel)}</b> — ` : '';

  if(log.action_type==='INSERT') return `${prefix}신규 등록되었습니다.`;
  if(log.action_type==='DELETE') return `${prefix}삭제되었습니다.`;

  const oldD = log.old_data||{}, newD = log.new_data||{};
  const skip = new Set(['updated_at','updated_by','created_at','created_by','id','deleted_at']);
  const changedKeys = Object.keys(newD).filter(k=>!skip.has(k) && JSON.stringify(oldD[k])!==JSON.stringify(newD[k]));
  if(!changedKeys.length) return `${prefix}변경 사항 없음`;

  // ---- 발주확인 3개 필드 변경은 한 문장으로 합쳐서 표시 ----
  if(table==='costco_orders'){
    const set = new Set(changedKeys);
    if(set.has('production_confirmed')){
      if(newD.production_confirmed===true){
        const who = historyFormatValue(table,'production_confirmed_by', newD.production_confirmed_by, profileNames);
        return `${prefix}<span class="badge b-green" style="font-size:11px;">발주확인</span> 처리 (확인자: ${who})`;
      }else{
        const who = historyFormatValue(table,'production_confirmed_by', oldD.production_confirmed_by, profileNames);
        return `${prefix}<span class="badge b-amber" style="font-size:11px;">발주확인 취소</span> (기존 확인자: ${who})`;
      }
    }
  }

  const parts = changedKeys.slice(0,4).map(k=>{
    const label = historyFieldLabel(table, k);
    const ov = historyFormatValue(table, k, oldD[k], profileNames);
    const nv = historyFormatValue(table, k, newD[k], profileNames);
    const chipKeys = new Set(['status','reservation_status']);
    if(chipKeys.has(k)) return `${label}: ${historyStatusChip(oldD[k])} → ${historyStatusChip(newD[k])}`;
    return `${label}: ${ov} → ${nv}`;
  });
  return prefix + parts.join(' &nbsp;·&nbsp; ') + (changedKeys.length>4?` 외 ${changedKeys.length-4}건`:'');
}
</script>
</body></html>
