<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>코스트코 생산·재고·출고 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#1c2a3a;
    --navy-2:#243447;
    --paper:#f5f6f8;
    --card:#ffffff;
    --line:#e2e5ea;
    --ink:#1c2430;
    --ink-soft:#5a6472;
    --accent:#c17a3d;
    --accent-dark:#a5652f;
    --blue:#2563eb;
    --green:#1a9e6b;
    --amber:#d18d1a;
    --red:#d64545;
    --gray:#8b93a1;
    --radius:10px;
    --shadow:0 1px 3px rgba(20,26,38,.08), 0 1px 2px rgba(20,26,38,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:inherit;}

  /* ---------- 로그인 화면 ---------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--navy) 0%,#101823 100%);
    padding:20px;
  }
  .login-card{
    width:100%;max-width:380px;background:var(--card);border-radius:16px;
    padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .login-card .brand{
    font-size:13px;letter-spacing:.14em;color:var(--accent-dark);font-weight:700;text-transform:uppercase;margin-bottom:6px;
  }
  .login-card h1{font-size:22px;margin-bottom:4px;}
  .login-card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
    outline:none;transition:border-color .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13.5px;
    transition:filter .12s, background .12s; white-space:nowrap;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{background:#f2f3f5;}
  .btn-danger{background:#fff;border-color:#f1c3c3;color:var(--red);}
  .btn-danger:hover{background:#fdf1f1;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}
  .login-error{
    background:#fdf1f1;border:1px solid #f1c3c3;color:var(--red);padding:10px 12px;border-radius:8px;
    font-size:12.5px;margin-bottom:14px;display:none;
  }

  /* ---------- 앱 셸 ---------- */
  #appShell{display:none;min-height:100vh;}
  .shell-grid{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
  .sidebar{
    background:#fff;color:var(--ink);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
    border-right:1px solid var(--line);
  }
  .sidebar .brand{padding:4px 4px 20px;}
  .sidebar .brand .t1{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;font-weight:700;}
  .sidebar .brand .t2{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:2px;
    color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;
  }
  .nav-item .ic{width:18px;text-align:center;font-size:15px;}
  .nav-item:hover{background:var(--paper);color:var(--ink);}
  .nav-item.active{background:var(--accent);color:#fff;}
  .sidebar-foot{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .who{font-size:12.5px;color:var(--ink-soft);padding:0 10px;margin-bottom:8px;line-height:1.5;}
  .who b{color:var(--ink);display:block;font-size:13.5px;}

  .main-col{display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
    background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  }
  .topbar .hamburger{display:none;background:none;border:none;font-size:20px;padding:4px 8px;color:var(--ink);}
  .page-title{font-size:18px;}
  .content{padding:22px 24px 60px;}

  /* ---------- 카드/그리드 ---------- */
  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);
    border-left:4px solid var(--gray);
  }
  .stat-card.c-blue{border-left-color:var(--blue);}
  .stat-card.c-green{border-left-color:var(--green);}
  .stat-card.c-amber{border-left-color:var(--amber);}
  .stat-card.c-red{border-left-color:var(--red);}
  .stat-card .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .stat-card .val{font-size:24px;font-weight:800;}
  .stat-card .val small{font-size:13px;font-weight:600;color:var(--ink-soft);margin-left:2px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .panel-head h3{font-size:15px;}
  .panel-body{padding:16px 18px;}
  .panel-body.pad0{padding:0;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;}
  .spacer{flex:1;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;padding:10px 12px;background:#fafbfc;color:var(--ink-soft);font-weight:700;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:10px 12px;border-bottom:1px solid #eef0f3;vertical-align:middle;}
  tbody tr:hover{background:#fbfaf8;}
  .table-wrap{overflow-x:auto;}
  .empty-row{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .inv-num{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--line);text-underline-offset:3px;}
  .inv-num:hover{background:#f2f5fa;}

  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .b-gray{background:#eef0f3;color:#5a6472;}
  .b-blue{background:#e6eefd;color:#2563eb;}
  .b-green{background:#e4f6ee;color:#1a9e6b;}
  .b-amber{background:#fdf2df;color:#b5790f;}
  .b-red{background:#fbe7e7;color:#c23636;}
  .b-navy{background:#e3e8ee;color:#1c2a3a;}

  .warn-list{list-style:none;margin:0;padding:0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .cal-grid-head{margin-bottom:8px;}
  .cal-headcell{text-align:center;font-size:12px;font-weight:700;color:var(--ink-soft);padding:4px 0;}
  .cal-cell{
    min-height:104px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 8px;background:#fff;
    display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:box-shadow .12s, border-color .12s;
  }
  .cal-cell:hover{box-shadow:0 2px 8px rgba(20,26,38,.10);border-color:var(--accent);}
  .cal-cell-out{background:#fafbfc;color:var(--gray);cursor:default;}
  .cal-cell-out:hover{box-shadow:none;border-color:var(--line);}
  .cal-cell-today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(193,122,61,.18) inset;}
  .cal-daynum{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .cal-today-chip{background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:99px;}
  .cal-tags{display:flex;flex-direction:column;gap:2px;}
  .cal-tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:1.5px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-tag b{font-weight:700;}
  .cal-tag-plan{background:#e6eefd;color:#2563eb;}
  .cal-tag-plandone{background:#ecfdf5;color:#0d9488;border:1px solid #99f6e4;}
  .cal-tag-amber{background:#fdf2df;color:#b5790f;}
  .cal-details{margin-top:4px;}
  .cal-details summary{list-style:none;cursor:pointer;font-size:10px;color:var(--accent-dark);font-weight:700;padding:1px 0;}
  .cal-details summary::-webkit-details-marker{display:none;}
  .cal-details[open] summary{margin-bottom:4px;}
  .cal-details-body{display:flex;flex-direction:column;gap:4px;padding:6px;background:#fafbfc;border-radius:6px;border:1px solid var(--line);}
  .cal-details-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .cal-details-lbl{font-size:10px;font-weight:700;color:var(--ink-soft);margin-right:2px;min-width:44px;}
  .prod-date-group{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  .prod-date-group summary{list-style:none;cursor:pointer;padding:10px 14px;background:#fafbfc;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .prod-date-group summary::-webkit-details-marker{display:none;}
  .prod-date-group summary::before{content:'▸';color:var(--ink-soft);font-size:11px;margin-right:2px;}
  .prod-date-group[open] summary::before{content:'▾';}
  .prod-date-group[open] summary{border-bottom:1px solid var(--line);}
  .prod-date-group-flat .prod-date-head{padding:10px 14px;background:#fafbfc;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
  .prod-date-label{font-weight:700;font-size:13.5px;color:var(--ink);}
  .prod-date-meta{font-size:12px;color:var(--ink-soft);}
  .prod-date-meta b{color:var(--ink);font-weight:700;}
  .cal-tag-green{background:#e4f6ee;color:#1a9e6b;}
  .cal-stock{margin-top:auto;font-size:10.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:3px;}
  .cal-cstock{display:inline-flex;font-size:10px;font-weight:700;border-radius:5px;padding:1.5px 5px;white-space:nowrap;}
  .cal-cstock-pos{background:#e4f6ee;color:#1a9e6b;}
  .cal-cstock-neg{background:#fbe7e7;color:#c23636;}
  .cal-cstock-zero{background:#eef0f3;color:var(--ink-soft);}
  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);align-items:center;}
  .cal-legend span{display:inline-flex;align-items:center;gap:4px;}
  .cal-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .warn-list li{
    display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid #f1f2f4;font-size:13px;
  }
  .warn-list li:last-child{border-bottom:none;}
  .warn-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:5px;flex:none;}

  /* ---------- 모달 ---------- */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(15,20,28,.5);z-index:100;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(0,0,0,.3);margin-bottom:40px;}
  .modal-box.wide{max-width:920px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:16px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);padding:4px 8px;}
  .modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr;}}

  .sub-table-actions{display:flex;gap:6px;}
  .item-row-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fafbfc;}
  .item-row-card .form-grid{grid-template-columns:repeat(3,1fr);}
  @media(max-width:700px){.item-row-card .form-grid{grid-template-columns:1fr 1fr;}}

  /* ---------- 토스트 ---------- */
  #toastRoot{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:#1c2430;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    min-width:220px;display:flex;align-items:center;gap:8px;animation:toastIn .18s ease-out;
  }
  .toast.ok{background:#16794f;}
  .toast.err{background:#b23434;}
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .ic{font-size:34px;margin-bottom:10px;}

  .helper-text{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .progress-bar{width:100%;height:7px;background:#eef0f3;border-radius:99px;overflow:hidden;}
  .progress-bar .fill{height:100%;background:var(--green);border-radius:99px;transition:width .2s;}
  .lot-row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
  @media(max-width:700px){.lot-row{grid-template-columns:1fr 1fr auto;}}
  .lot-row input{padding:8px 9px;border:1px solid var(--line);border-radius:6px;}
  .lot-sum{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .lot-sum b{color:var(--ink);}

  .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29;}
  @media(max-width:900px){
    .shell-grid{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;width:230px;transform:translateX(-100%);transition:transform .2s;z-index:30;
    }
    .sidebar.open{transform:translateX(0);}
    .topbar .hamburger{display:inline-block;}
    .mobile-overlay.open{display:block;}
    .content{padding:16px;}
    .cards-row{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

/* ============================================================
   유틸 함수
   ============================================================ */
function todayKST(){
  const d = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
  return fmtDateISO(d);
}
function fmtDateISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDaysISO(iso, days){
  if(!iso) return iso;
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+days);
  return fmtDateISO(d);
}
function letterSuffix(n){
  // 0=A, 1=B, ..., 25=Z, 26=AA, 27=AB, ..., 51=AZ, 52=BA, ...
  let s = '';
  n = n + 1;
  while(n > 0){
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
function diffDaysISO(a,b){ // a-b in days
  if(!a||!b) return null;
  return Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00'))/86400000);
}
async function nextPalletNumbers(dateISO, count){
  const prefix = 'P' + (dateISO||todayKST()).replace(/-/g,'');
  const { data, error } = await sb.from('costco_pallets').select('pallet_no').ilike('pallet_no', prefix + '%');
  if(error) throw error;
  const startIdx = (data||[]).length;
  const results = [];
  for(let i=0;i<count;i++){ results.push(prefix + letterSuffix(startIdx + i)); }
  return results;
}
async function computePalletPreviewMap(allBatches){
  const map = {};
  const byDate = {};
  allBatches.forEach(b=>{
    if(!b.planned_production_date || b.status==='취소' || b.status==='생산완료') return;
    (byDate[b.planned_production_date] = byDate[b.planned_production_date]||[]).push(b);
  });
  for(const date of Object.keys(byDate)){
    const list = byDate[date].sort((a,b)=> (a.created_at||'') < (b.created_at||'') ? -1 : 1);
    const prefix = 'P' + date.replace(/-/g,'');
    const { data } = await sb.from('costco_pallets').select('pallet_no').ilike('pallet_no', prefix + '%');
    let offset = (data||[]).length;
    for(const b of list){
      const n = b.planned_pallet_count || 1;
      map[b.id] = Array.from({length:n}, (_,i)=> prefix + letterSuffix(offset + i));
      offset += n;
    }
  }
  return map;
}
async function palletNumbersForBatch(batch){
  // 실제 파렛트 생성 시에는 그날 DB에 이미 생성된 파렛트 개수만 기준으로 다음 번호를 매긴다.
  // (계획을 여러 번 나눠서 완료 처리할 때, 아직 완료되지 않은 잔여 계획 수량이
  //  알파벳 자리를 미리 차지해버려서 중복 번호가 발생하던 버그 수정)
  return await nextPalletNumbers(batch.planned_production_date, batch.planned_pallet_count||1);
}
function computeExpirationFromSerial(serial){
  if(!serial) return null;
  const digits = String(serial).replace(/[^0-9]/g,'');
  if(digits.length < 8) return null;
  const y = digits.slice(0,4), m = digits.slice(4,6), d = digits.slice(6,8);
  if(m<'01'||m>'12'||d<'01'||d>'31') return null;
  const dt = new Date(`${y}-${m}-${d}T00:00:00`);
  if(isNaN(dt.getTime())) return null;
  dt.setFullYear(dt.getFullYear()+1);
  dt.setDate(dt.getDate()-1);
  return fmtDateISO(dt);
}
function palletExpirationGroups(pallet){
  const lots = (pallet.costco_pallet_lots||[]).filter(l=>l.serial_no && !l._deleted);
  const groups = {};
  lots.forEach(l=>{
    const exp = computeExpirationFromSerial(l.serial_no);
    if(!exp) return;
    groups[exp] = (groups[exp]||0) + (parseInt(l.quantity)||0);
  });
  return groups;
}
function palletExpirationDisplay(pallet){
  const groups = palletExpirationGroups(pallet);
  const keys = Object.keys(groups).sort();
  if(!keys.length) return fmtDateDisp(pallet.expiration_date);
  if(keys.length===1) return fmtDateDisp(keys[0]);
  return keys.map(k=>`${fmtDateDisp(k)}(${groups[k]}개)`).join(', ');
}
function fmtDateDisp(iso){
  if(!iso) return '-';
  const [y,m,d]=iso.split('-');
  return `${y}.${m}.${d}`;
}
function nowKSTString(){
  return new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul', hour12:false});
}
function esc(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function toast(msg, type){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='ok'?' ok':type==='err'?' err':'');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 2600);
}
function friendlyError(err){
  const m = (err && (err.message||err.error_description||err.toString())) || '알 수 없는 오류가 발생했습니다.';
  if(m.includes('duplicate key')) return '이미 등록된 값입니다. 다시 확인해 주세요.';
  if(m.includes('violates row-level security') || m.includes('permission denied')) return '이 작업을 수행할 권한이 없습니다.';
  if(m.includes('violates foreign key constraint')) return '이 항목은 다른 데이터에서 이미 사용 중이라 삭제할 수 없습니다.';
  if(m.includes('출고 완료') || m.includes('출고완료') || m.includes('일 수 없') || m.includes('이전일')) return m;
  return '오류가 발생했습니다: ' + m;
}
function csvDownload(filename, rows){
  if(!rows || !rows.length){ toast('내보낼 데이터가 없습니다.','err'); return; }
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(',')].concat(
    rows.map(r=>headers.map(h=>{
      let v = r[h]; if(v===null||v===undefined) v='';
      v = String(v).replace(/"/g,'""');
      return /[",\n]/.test(v) ? `"${v}"` : v;
    }).join(','))
  );
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- 공용 기간선택(월별/년별/특정기간) ---------- */
function lastDayOfMonthISO(ym){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m, 0);
  return fmtDateISO(d);
}
function setPeriodRange(filters, mode){
  const t = todayKST();
  if(mode==='month'){
    const ym = t.slice(0,7);
    filters.from = ym+'-01';
    filters.to = lastDayOfMonthISO(ym);
  }else if(mode==='year'){
    const y = t.slice(0,4);
    filters.from = y+'-01-01';
    filters.to = y+'-12-31';
  }
}
function shiftPeriod(filters, unit, dir){
  if(unit==='month'){
    const [y,m] = (filters.from||todayKST()).split('-').map(Number);
    let ny=y, nm=m+dir;
    if(nm<1){nm=12;ny--;} if(nm>12){nm=1;ny++;}
    const ym = `${ny}-${String(nm).padStart(2,'0')}`;
    filters.from = ym+'-01';
    filters.to = lastDayOfMonthISO(ym);
  }else if(unit==='year'){
    const y = parseInt((filters.from||todayKST()).slice(0,4)) + dir;
    filters.from = y+'-01-01';
    filters.to = y+'-12-31';
  }
}
function periodPickerHtml(filters, tabKey, varName){
  const mode = filters.periodMode || 'month';
  const label = mode==='month' ? (filters.from||todayKST()).slice(0,7).replace('-','.')+'월'
    : mode==='year' ? (filters.from||todayKST()).slice(0,4)+'년' : '';
  return `
    <select onchange="${varName}.periodMode=this.value; setPeriodRange(${varName},this.value); switchTab('${tabKey}')">
      <option value="month" ${mode==='month'?'selected':''}>월별</option>
      <option value="year" ${mode==='year'?'selected':''}>년별</option>
      <option value="custom" ${mode==='custom'?'selected':''}>특정기간</option>
    </select>
    ${mode==='month'?`
      <button class="btn btn-ghost btn-sm" onclick="shiftPeriod(${varName},'month',-1); switchTab('${tabKey}')">‹</button>
      <b style="font-size:13px;white-space:nowrap;">${label}</b>
      <button class="btn btn-ghost btn-sm" onclick="shiftPeriod(${varName},'month',1); switchTab('${tabKey}')">›</button>
    `:mode==='year'?`
      <button class="btn btn-ghost btn-sm" onclick="shiftPeriod(${varName},'year',-1); switchTab('${tabKey}')">‹</button>
      <b style="font-size:13px;white-space:nowrap;">${label}</b>
      <button class="btn btn-ghost btn-sm" onclick="shiftPeriod(${varName},'year',1); switchTab('${tabKey}')">›</button>
    `:`
      <input type="date" value="${filters.from||''}" onchange="${varName}.from=this.value; switchTab('${tabKey}')">
      <span style="color:var(--ink-soft)">~</span>
      <input type="date" value="${filters.to||''}" onchange="${varName}.to=this.value; switchTab('${tabKey}')">
    `}
  `;
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* 확인창 */
function confirmModal(message, onConfirm, opts){
  opts = opts || {};
  openModal(opts.title || '확인', `<p style="line-height:1.6;white-space:pre-line;">${esc(message)}</p>`, [
    { label:'취소', cls:'btn-ghost', onClick: closeModal },
    { label: opts.confirmLabel || '확인', cls: opts.danger?'btn-danger':'btn-primary', onClick: async ()=>{ await onConfirm(); } }
  ]);
}

/* 모달 공통 */
function openModal(title, bodyHtml, buttons, wide, locked){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const foot = document.getElementById('modalFoot');
  foot.innerHTML = '';
  (buttons||[]).forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls||'btn-ghost');
    btn.textContent = b.label;
    btn.onclick = b.onClick;
    btn.id = b.id || '';
    foot.appendChild(btn);
  });
  document.getElementById('modalBox').classList.toggle('wide', !!wide);
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalOverlay').dataset.locked = locked ? '1' : '';
  document.querySelector('.modal-close').style.display = locked ? 'none' : '';
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalOverlay').dataset.locked = '';
}
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay' && e.currentTarget.dataset.locked!=='1') closeModal();
});

function toggleSidebar(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('mobileOverlay').classList.toggle('open', open);
}

/* 권한 헬퍼 */
function myRole(){ return STATE.profile ? STATE.profile.role : 'viewer'; }
function can(...roles){ return roles.includes(myRole()); }
</script>
<script>
/* ============================================================
   인증 (로그인/로그아웃/세션)
   ============================================================ */
async function handleLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display='none';
  if(!email || !password){
    errBox.textContent = '이메일과 비밀번호를 입력해 주세요.';
    errBox.style.display='block';
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '로그인 중...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = '로그인';
  if(error){
    errBox.textContent = '로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.';
    errBox.style.display='block';
    return;
  }
  await afterLogin(data.session);
}
async function handleLogout(){
  await sb.auth.signOut();
  STATE.session=null; STATE.profile=null;
  document.getElementById('appShell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginEmail').value=''; document.getElementById('loginPassword').value='';
}
async function afterLogin(session){
  STATE.session = session;
  let { data: profile, error } = await sb.from('costco_profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error || !profile){
    toast('프로필 정보를 불러오지 못했습니다. 관리자에게 문의해 주세요.', 'err');
    return;
  }
  if(!profile.is_active){
    toast('비활성화된 계정입니다. 관리자에게 문의해 주세요.', 'err');
    await sb.auth.signOut();
    return;
  }
  STATE.profile = profile;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='block';
  document.getElementById('whoName').textContent = profile.name || profile.email;
  document.getElementById('whoRole').textContent = ROLE_LABEL[profile.role] || profile.role;
  await loadLookups();
  renderNav();
  switchTab('dashboard');
  startClock();
}
async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data && data.session){
    await afterLogin(data.session);
  }
}
function startClock(){
  const el = document.getElementById('topbarClock');
  const tick = ()=>{ el.textContent = nowKSTString() + ' (KST)'; };
  tick(); setInterval(tick, 30000);
}

/* ============================================================
   기준정보 로드 (제품유형/파렛트유형/국가/출고처)
   ============================================================ */
async function loadLookups(){
  const [{data:pt}, {data:pr}, {data:ct}, {data:dt}] = await Promise.all([
    sb.from('costco_product_types').select('*').order('type_name'),
    sb.from('costco_products').select('*').order('product_name'),
    sb.from('costco_countries').select('*').order('country_name'),
    sb.from('costco_destinations').select('*').order('destination_name'),
  ]);
  STATE.productTypes = pt||[];
  STATE.products = pr||[];
  STATE.countries = ct||[];
  STATE.destinations = dt||[];
}
function productName(id){ const p = STATE.products.find(x=>x.id===id); return p? p.product_name : '-'; }
function countryName(id){ const c = STATE.countries.find(x=>x.id===id); return c? c.country_name : '-'; }
function destinationName(id){ const d = STATE.destinations.find(x=>x.id===id); return d? d.destination_name : '-'; }
function activeDestinations(countryId){
  return STATE.destinations.filter(d=>d.is_active && (!countryId || d.country_id===countryId));
}
function activeProducts(){ return STATE.products.filter(p=>p.is_active); }
function activeCountries(){ return STATE.countries.filter(c=>c.is_active); }

/* ============================================================
   네비게이션 / 탭 전환
   ============================================================ */
function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = TABS.map(t=>`
    <div class="nav-item ${t.key===STATE.currentTab?'active':''}" onclick="switchTab('${t.key}')">
      <span class="ic">${t.ic}</span><span>${t.label}</span>
    </div>`).join('');
}
async function switchTab(key){
  STATE.currentTab = key;
  document.getElementById('pageTitle').textContent = TABS.find(t=>t.key===key).label;
  renderNav();
  toggleSidebar(false);
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty-state">불러오는 중...</div>';
  try{
    if(key==='dashboard') await renderDashboard();
    else if(key==='calendar') await renderCalendarTab();
    else if(key==='orders') await renderOrders();
    else if(key==='production') await renderProduction();
    else if(key==='inventory') await renderInventory();
    else if(key==='dispatch') await renderDispatch();
    else if(key==='warehouse') await renderWarehouse();
    else if(key==='tracking') await renderTracking();
    else if(key==='analytics') await renderAnalytics();
    else if(key==='master') await renderMaster();
    else if(key==='history') await renderHistory();
    else if(key==='settings') await renderSettings();
  }catch(e){
    console.error(e);
    content.innerHTML = `<div class="empty-state"><div class="ic">⚠️</div>${esc(friendlyError(e))}</div>`;
  }
}

/* ============================================================
   초기화
   ============================================================ */
sb.auth.onAuthStateChange((event, session)=>{
  if(event==='SIGNED_OUT'){
    STATE.session=null; STATE.profile=null;
  }
});
checkSession();
</script>

function deleteMasterRow(table, id, label){
  confirmModal(`이 ${label} 항목을 완전히 삭제하시겠습니까?\n다른 데이터에서 사용 중이면 삭제할 수 없습니다.`, async ()=>{

function orderCoverage(order, pallets){
  const linked = (pallets||[]).filter(p=>p.order_id===order.id && p.status!=='취소');
  const matched = linked.filter(p=>p.status==='매칭완료').length;

  const reserved = matched + dispatched;
  const shortage = Math.max(0, (order.planned_pallet_count||0) - reserved);
  return { matched, dispatched, reserved, shortage };
}

  const dispatched = linked.filter(p=>p.status==='출고완료').length;
  const matched = linked.filter(p=>p.status==='매칭완료').length;
  const reserved = matched + dispatched;
  if(dispatched >= order.planned_pallet_count) return '출고완료';
  if(reserved >= order.planned_pallet_count) return '출고대기';
  if(reserved > 0) return '부분진행';
  return '미착수';
}
function orderStatusBadge(status){

  return `<span class="badge ${map[status]||'b-navy'}">${status}</span>`;

function startOfWeekISO(iso){
  const d = new Date(iso+'T00:00:00');
  const day = d.getDay(); // 0=Sun
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return fmtDateISO(d);

<script>
/* ============================================================
   캘린더 (월간 전체 진행 현황)
   ============================================================ */
let CAL_STATE = (()=>{ const t=todayKST(); return { year:+t.slice(0,4), month:+t.slice(5,7) }; })();
function calMonthKey(){ return `${CAL_STATE.year}-${String(CAL_STATE.month).padStart(2,'0')}`; }
function calShiftMonth(delta){
  let m = CAL_STATE.month + delta, y = CAL_STATE.year;
  while(m<1){ m+=12; y--; } while(m>12){ m-=12; y++; }
  CAL_STATE.year=y; CAL_STATE.month=m;
  switchTab('calendar');
}
function calMonthGridDates(){
  const first = `${calMonthKey()}-01`;
  const gridStart = startOfWeekISO(first);
  const lastOfMonth = lastDayOfMonthISO(calMonthKey());
  const gridEndAnchor = startOfWeekISO(lastOfMonth);
  const totalDays = Math.round((new Date(gridEndAnchor+'T00:00:00') - new Date(gridStart+'T00:00:00'))/86400000) + 7;
  return Array.from({length: totalDays}, (_,i)=>addDaysISO(gridStart, i));
}
async function renderCalendarTab(){
  const today = todayKST();
  const monthKey = calMonthKey();
  const monthStart = `${monthKey}-01`;
  const monthEnd = lastDayOfMonthISO(monthKey);
  const gridDates = calMonthGridDates();
  const gridStart = gridDates[0], gridEnd = gridDates[gridDates.length-1];

  const [ordersAll, plansAll, pallets, dispatchLinksRaw] = await Promise.all([
    loadOrdersFull(null, null),
    loadProductionPlans(null, null),
    loadPalletsFull({}),
    sb.from('costco_dispatch_pallets').select('pallet_id, costco_dispatches(actual_ship_date)').then(r=>r.data||[]),
  ]);
  const activeOrders = ordersAll.filter(o=>o.status!=='취소');
  const activePlans = plansAll.filter(p=>p.status!=='취소');
  const activePallets = pallets.filter(p=>p.status!=='취소');
  const dispatchDateByPallet = {};
  dispatchLinksRaw.forEach(l=>{ if(l.costco_dispatches?.actual_ship_date) dispatchDateByPallet[l.pallet_id] = l.costco_dispatches.actual_ship_date; });

  // 캘린더에 표시할 국가 목록 (실제 데이터가 있는 국가만)
  const calCountryIds = [...new Set([
    ...activePallets.map(p=>p.country_id),
    ...activeOrders.map(o=>o.country_id),
  ].filter(Boolean))];

  // ---- 일자별 집계 (그리드 범위 내) ----
  function dayCalInfo(date){
    const dayPlans = activePlans.filter(p=>p.planned_production_date===date);
    const planQty = dayPlans.reduce((a,p)=>a+(p.planned_pallet_count||0),0);
    const planDoneQty = dayPlans.filter(p=>p.status==='생산완료').reduce((a,p)=>a+(p.planned_pallet_count||0),0);
    const planByCountry = {}, planDoneByCountry = {};
    dayPlans.forEach(p=>{
      const key = p.country_id || 'none';
      planByCountry[key] = (planByCountry[key]||0) + (p.planned_pallet_count||0);
      if(p.status==='생산완료') planDoneByCountry[key] = (planDoneByCountry[key]||0) + (p.planned_pallet_count||0);
    });
    const planBreakdown = Object.entries(planByCountry).map(([countryId,qty])=>({
      name: countryId==='none' ? '국가 미지정' : countryName(countryId), qty
    }));
    const planDoneBreakdown = Object.entries(planDoneByCountry).map(([countryId,qty])=>({
      name: countryId==='none' ? '국가 미지정' : countryName(countryId), qty
    }));

    const dayOrders = activeOrders.filter(o=>o.planned_ship_date===date);
    const shipPlanQty = dayOrders.reduce((a,o)=>a+(o.planned_pallet_count||0),0);
    const destByOrder = {};
    dayOrders.forEach(o=>{
      const key = o.destination_id || 'none';
      destByOrder[key] = (destByOrder[key]||0) + (o.planned_pallet_count||0);
    });
    const shipDestBreakdown = Object.entries(destByOrder).map(([destId,qty])=>({
      name: destId==='none' ? '납품처 미지정' : destinationName(destId), qty
    }));

    const shippedToday = activePallets.filter(p=>dispatchDateByPallet[p.id]===date);
    const shipDoneQty = shippedToday.length;
    const shipDoneByCountry = {};
    shippedToday.forEach(p=>{
      const key = p.country_id || 'none';
      shipDoneByCountry[key] = (shipDoneByCountry[key]||0) + 1;
    });
    const shipDoneBreakdown = Object.entries(shipDoneByCountry).map(([countryId,qty])=>({
      name: countryId==='none' ? '국가 미지정' : countryName(countryId), qty
    }));

    // 국가별 순재고(그 날짜 기준) = 매칭 제외 여유재고(재고보유, 생산일<=D) - 그 시점까지 출고예정일 도래한 미매칭 부족수요
    // → 플러스면 여유재고, 마이너스면 부족
    const countryStocks = calCountryIds.map(countryId=>{
      const freeNow = activePallets.filter(p=>p.country_id===countryId && p.status==='재고보유' && p.production_date && p.production_date<=date).length;
      const dueOrders = activeOrders.filter(o=>o.country_id===countryId && (o.planned_ship_date||'')<=date && orderStatusOf(o,pallets)!=='출고완료');
      const shortage = dueOrders.reduce((a,o)=>a+Math.max(0,orderCoverage(o,pallets).shortage),0);
      return { countryId, name: countryName(countryId), net: freeNow - shortage };
    }).filter(c=>c.net!==0);
    const netTotal = countryStocks.reduce((a,c)=>a+c.net,0);

    return { date, planQty, planDoneQty, planBreakdown, planDoneBreakdown, shipPlanQty, shipDestBreakdown, shipDoneQty, shipDoneBreakdown, countryStocks, netTotal, dayPlans, dayOrders, shippedToday };
  }
  const infoByDate = {};
  gridDates.forEach(d=>{ infoByDate[d] = dayCalInfo(d); });
  STATE.cache.calInfoByDate = infoByDate;

  // ---- 이번 달 요약 ----
  const monthDates = gridDates.filter(d=>d>=monthStart && d<=monthEnd);
  const monthPlanQty = monthDates.reduce((a,d)=>a+infoByDate[d].planQty,0);
  const monthShipPlanQty = monthDates.reduce((a,d)=>a+infoByDate[d].shipPlanQty,0);
  const monthShipDoneQty = monthDates.reduce((a,d)=>a+infoByDate[d].shipDoneQty,0);
  const todayInfo = infoByDate[today];
  const todayCountryStocks = todayInfo ? todayInfo.countryStocks : [];

  const weekDayNames = ['월','화','수','목','금','토','일'];
  const weeks = [];
  for(let i=0;i<gridDates.length;i+=7) weeks.push(gridDates.slice(i,i+7));

  function stockChip(c){ return calStockChip(c); }

  function dayCellHtml(date){
    const info = infoByDate[date];
    const inMonth = date>=monthStart && date<=monthEnd;
    const isToday = date===today;
    const dayNum = +date.slice(8,10);
    const dow = new Date(date+'T00:00:00').getDay();
    const dowColor = dow===0 ? 'var(--red)' : dow===6 ? 'var(--blue)' : 'var(--ink)';
    const hasDetail = info.planBreakdown.length || info.planDoneBreakdown.length || info.shipDestBreakdown.length || info.shipDoneBreakdown.length;
    return `
      <div class="cal-cell ${inMonth?'':'cal-cell-out'} ${isToday?'cal-cell-today':''}">
        <div class="cal-daynum" style="color:${inMonth?dowColor:'var(--gray)'};">${dayNum}${isToday?' <span class="cal-today-chip">오늘</span>':''}</div>
        ${inMonth ? `
        <div class="cal-tags">
          ${info.planQty>0?`<div class="cal-tag cal-tag-plan">생산계획 ${info.planQty}</div>`:''}
          ${info.planDoneQty>0?`<div class="cal-tag cal-tag-plandone">생산완료 ${info.planDoneQty}</div>`:''}
          ${info.shipPlanQty>0?`<div class="cal-tag cal-tag-amber">출고예정 ${info.shipPlanQty}</div>`:''}
          ${info.shipDoneQty>0?`<div class="cal-tag cal-tag-green">출고완료 ${info.shipDoneQty}</div>`:''}
        </div>
        <div class="cal-stock">${info.countryStocks.length ? info.countryStocks.map(stockChip).join('') : '<span class="cal-cstock cal-cstock-zero">재고 0</span>'}</div>
        ${hasDetail ? `
        <details class="cal-details" onclick="event.stopPropagation()">
          <summary>상세보기 ▾</summary>
          <div class="cal-details-body">
            ${info.planBreakdown.length?`<div class="cal-details-row"><span class="cal-details-lbl">생산계획</span>${info.planBreakdown.map(d=>`<span class="cal-tag cal-tag-plan">${esc(d.name)} ${d.qty}</span>`).join('')}</div>`:''}
            ${info.planDoneBreakdown.length?`<div class="cal-details-row"><span class="cal-details-lbl">생산완료</span>${info.planDoneBreakdown.map(d=>`<span class="cal-tag cal-tag-plandone">${esc(d.name)} ${d.qty}</span>`).join('')}</div>`:''}
            ${info.shipDestBreakdown.length?`<div class="cal-details-row"><span class="cal-details-lbl">출고예정</span>${info.shipDestBreakdown.map(d=>`<span class="cal-tag cal-tag-amber">${esc(d.name)} ${d.qty}</span>`).join('')}</div>`:''}
            ${info.shipDoneBreakdown.length?`<div class="cal-details-row"><span class="cal-details-lbl">출고완료</span>${info.shipDoneBreakdown.map(d=>`<span class="cal-tag cal-tag-green">${esc(d.name)} ${d.qty}</span>`).join('')}</div>`:''}
          </div>
        </details>` : ''}
        ` : ''}
      </div>`;
  }

  const html = `

<script>
function donutSvg(percent, color, label, sub, centerTextOverride){
  const size=132, r=50, stroke=14;
  const c = 2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = c * (1-pct/100);
  const centerText = centerTextOverride!==undefined ? centerTextOverride : `${Math.round(pct)}%`;
  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#eef0f3" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
          transform="rotate(-90 ${size/2} ${size/2})"/>
        <text x="${size/2}" y="${size/2+7}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${esc(String(centerText))}</text>
      </svg>
      <div style="text-align:center;">
        <div style="font-size:13px;font-weight:700;">${esc(label)}</div>
        ${sub?`<div style="font-size:11.5px;color:var(--ink-soft);">${esc(sub)}</div>`:''}
      </div>
    </div>`;
}
const DONUT_COLORS = ['var(--blue)','var(--green)','var(--amber)','#8b5cf6','#0891b2','var(--red)','#65a30d'];
function multiDonutSvg(segments, title, centerLabel){
  const size=132, r=50, stroke=14;
  const c = 2*Math.PI*r;
  const total = segments.reduce((a,s)=>a+s.value,0);
  let offsetAcc = 0;
  const circles = total>0 ? segments.map((s,i)=>{
    const frac = s.value/total;
    const dash = frac*c;
    const circle = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}"
      stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-offsetAcc}"
      transform="rotate(-90 ${size/2} ${size/2})"/>`;
    offsetAcc += dash;
    return circle;
  }).join('') : '';
  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#eef0f3" stroke-width="${stroke}"/>
        ${circles}
        <text x="${size/2}" y="${size/2+7}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)">${centerLabel}</text>
      </svg>
      <div style="text-align:center;max-width:170px;">
        <div style="font-size:13px;font-weight:700;">${esc(title)}</div>
        ${segments.length?`<div style="font-size:11px;color:var(--ink-soft);line-height:1.7;text-align:left;margin-top:2px;">
          ${segments.map(s=>`<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:4px;"></span>${esc(s.label)}: ${s.value}`).join('<br>')}
        </div>`:`<div style="font-size:11.5px;color:var(--ink-soft);">여유재고 없음</div>`}
      </div>
    </div>`;
}
function computeAtRiskOrderIds(activeOrders, activePlans, pallets){
  const atRisk = new Set();
  const keys = new Set();
  activeOrders.forEach(o=>keys.add(o.product_id+'|'+o.country_id));
  keys.forEach(key=>{
    const [productId, countryId] = key.split('|');
    const freeNow = pallets.filter(p=>p.status==='재고보유' && p.product_id===productId && p.country_id===countryId).length;
    const futurePlans = activePlans.filter(p=>p.status==='계획중' && p.product_id===productId && p.country_id===countryId)
      .sort((a,b)=> (a.planned_production_date||'') < (b.planned_production_date||'') ? -1 : 1);
    const groupOrders = activeOrders.filter(o=>o.product_id===productId && o.country_id===countryId && orderStatusOf(o,pallets)!=='출고완료')
      .map(o=>({ o, shortage: orderCoverage(o,pallets).shortage }))
      .filter(x=>x.shortage>0)
      .sort((a,b)=> (a.o.planned_ship_date||'') < (b.o.planned_ship_date||'') ? -1 : 1);
    let supply = freeNow, demand = 0, planIdx = 0;
    groupOrders.forEach(({o, shortage})=>{
      const cutoff = addDaysISO(o.planned_ship_date||'', -1); // 출고예정일 전날까지 생산되어야 안전 (당일 생산은 리드타임 부족으로 경고 대상)
      while(planIdx<futurePlans.length && (futurePlans[planIdx].planned_production_date||'') <= cutoff){
        supply += futurePlans[planIdx].planned_pallet_count||0;
        planIdx++;
      }
      demand += shortage;
      if(demand > supply) atRisk.add(o.id);
    });
  });
  return atRisk;
}
function computeInventoryStatusByGroup(activeOrders, activePlans, pallets){
  const groupKeys = new Set();
  activeOrders.forEach(o=>{ if(o.product_id && o.country_id && orderStatusOf(o,pallets)!=='출고완료') groupKeys.add(o.product_id+'|'+o.country_id); });
  pallets.forEach(p=>{ if(p.status==='재고보유' && p.product_id && p.country_id) groupKeys.add(p.product_id+'|'+p.country_id); });
  activePlans.forEach(p=>{ if(p.status==='계획중' && p.product_id && p.country_id) groupKeys.add(p.product_id+'|'+p.country_id); });

  const rows = [...groupKeys].map(key=>{
    const [productId, countryId] = key.split('|');
    const freeNow = pallets.filter(p=>p.status==='재고보유' && p.product_id===productId && p.country_id===countryId).length;

    const groupOrders = activeOrders
      .filter(o=>o.product_id===productId && o.country_id===countryId && orderStatusOf(o,pallets)!=='출고완료')
      .map(o=>({ o, cov: orderCoverage(o,pallets) }))
      .sort((a,b)=> (a.o.planned_ship_date||'') < (b.o.planned_ship_date||'') ? -1 : 1);

    const demandQty = groupOrders.reduce((a,r)=>a + Math.max(0, (r.o.planned_pallet_count||0) - r.cov.dispatched), 0); // 출고예정(잔여)
    const matchedQty = groupOrders.reduce((a,r)=>a + r.cov.matched, 0); // 이미 매칭완료(재고 확보)된 수량
    const totalShortage = groupOrders.reduce((a,r)=>a + Math.max(0, r.cov.shortage), 0); // 매칭 기준 부족수요

    const futurePlans = activePlans.filter(p=>p.status==='계획중' && p.product_id===productId && p.country_id===countryId)
      .sort((a,b)=> (a.planned_production_date||'') < (b.planned_production_date||'') ? -1 : 1);
    const planQty = futurePlans.reduce((a,p)=>a+(p.planned_pallet_count||0),0);

    const freeStock = Math.max(0, freeNow - totalShortage);
    const shortage = Math.max(0, totalShortage - freeNow);

    let statusKind = 'ok', resolveDate = null;
    if(shortage>0){
      const earliestCutoff = groupOrders.filter(r=>r.cov.shortage>0).reduce((min,r)=>{
        const cutoff = addDaysISO(r.o.planned_ship_date||'', -1);
        return (min===null || cutoff<min) ? cutoff : min;
      }, null);
      let cumulative = freeNow;
      for(const p of futurePlans){
        if(earliestCutoff!==null && (p.planned_production_date||'')>earliestCutoff) break;
        cumulative += (p.planned_pallet_count||0);
        if(cumulative >= totalShortage){ resolveDate = p.planned_production_date; statusKind = 'resolving'; break; }
      }
      if(!resolveDate) statusKind = 'risk';
    }
    return { productId, countryId, demandQty, matchedQty, freeNow, planQty, freeStock, shortage, statusKind, resolveDate };
  });

  return rows.filter(r=> r.demandQty>0 || r.freeNow>0 || r.planQty>0)
    .sort((a,b)=> (b.statusKind==='risk')-(a.statusKind==='risk') || b.shortage - a.shortage || b.demandQty - a.demandQty);
}
function invStatusBadge(row){
  if(row.statusKind==='risk') return '<span class="badge b-red">⚠ 부족위험</span>';
  if(row.statusKind==='resolving') return `<span class="badge b-amber">생산예정 해소 · ${fmtDateDisp(row.resolveDate)}</span>`;
  if(row.shortage>0) return '<span class="badge b-amber">부족</span>';
  return '<span class="badge b-green">정상</span>';
}
function invGroupDetail(productId, countryId){
  const { activeOrders, activePlans, pallets } = STATE.cache.dashInv || { activeOrders:[], activePlans:[], pallets:[] };
  const groupOrders = activeOrders
    .filter(o=>o.product_id===productId && o.country_id===countryId && orderStatusOf(o,pallets)!=='출고완료')
    .map(o=>({ o, cov: orderCoverage(o,pallets) }))
    .sort((a,b)=> (a.o.planned_ship_date||'') < (b.o.planned_ship_date||'') ? -1 : 1);
  const futurePlans = activePlans.filter(p=>p.status==='계획중' && p.product_id===productId && p.country_id===countryId)
    .sort((a,b)=> (a.planned_production_date||'') < (b.planned_production_date||'') ? -1 : 1);
  const freePallets = pallets.filter(p=>p.status==='재고보유' && p.product_id===productId && p.country_id===countryId)
    .sort((a,b)=> (a.production_date||'') < (b.production_date||'') ? -1 : 1);
  return { groupOrders, futurePlans, freePallets };
}
function invDetailOrderTable(groupOrders, highlight){
  if(!groupOrders.length) return `<div class="empty-row">해당하는 발주가 없습니다.</div>`;
  return `<div class="table-wrap"><table>

    <tbody>
    ${groupOrders.map(({o,cov})=>`
      <tr>
        <td>${esc(o.order_no)}</td>

}

    <thead><tr><th>파렛트일련번호</th><th>생산일</th><th>소비기한</th><th>LOT수</th></tr></thead>

function invDetailPlanTable(plans){

    <thead><tr><th>계획번호</th><th>생산예정일</th><th>수량</th><th>생산담당자</th></tr></thead>
    <tbody>
    ${plans.map(p=>`
      <tr>
        <td>${esc(p.plan_no||'')}</td>
        <td>${fmtDateDisp(p.planned_production_date)}</td>

        <td>${esc(p.production_manager||'-')}</td>
      </tr>`).join('')}

}
function showInvDetail(productId, countryId, metric){
  const { groupOrders, futurePlans, freePallets } = invGroupDetail(productId, countryId);
  const label = `${productName(productId)} · ${countryName(countryId)}`;
  const totalShortage = groupOrders.reduce((a,r)=>a+Math.max(0,r.cov.shortage),0);
  const freeNow = freePallets.length;

  let title = '', bodyHtml = '';
  if(metric==='demand'){
    title = `출고예정 근거 · ${label}`;
    bodyHtml = `<div style="margin-bottom:10px;font-size:12.5px;color:var(--ink-soft);">아직 출고완료되지 않은 발주의 잔여수량 합계입니다.</div>${invDetailOrderTable(groupOrders)}`;
  } else if(metric==='matched'){
    title = `매칭완료 근거 · ${label}`;
    bodyHtml = `<div style="margin-bottom:10px;font-size:12.5px;color:var(--ink-soft);">이미 재고와 매칭되어 출고만 남은 수량입니다(매칭완료 컬럼 참고).</div>${invDetailOrderTable(groupOrders,'matched')}`;
  } else if(metric==='free'){
    title = `현재고 근거 · ${label}`;
    bodyHtml = `<div style="margin-bottom:10px;font-size:12.5px;color:var(--ink-soft);">현재 '재고보유' 상태(아직 매칭 안 됨)인 파렛트 목록입니다.</div>${invDetailPalletTable(freePallets)}`;
  } else if(metric==='plan'){
    title = `생산계획 근거 · ${label}`;
    bodyHtml = `<div style="margin-bottom:10px;font-size:12.5px;color:var(--ink-soft);">'계획중' 상태인 향후 생산계획 목록입니다.</div>${invDetailPlanTable(futurePlans)}`;
  } else if(metric==='freeStock'){
    title = `여유재고 근거 · ${label}`;
    const freeStock = Math.max(0, freeNow - totalShortage);
    bodyHtml = `
      <div class="panel" style="margin-bottom:14px;"><div class="panel-body" style="font-size:13px;line-height:1.9;">
        현재고 <b>${freeNow}</b> − 부족수요(매칭 안 된 발주분) <b>${totalShortage}</b> = 여유재고 <b style="color:var(--green)">${freeStock}</b>
      </div></div>
      <h4 style="margin-bottom:8px;font-size:13.5px;">현재고 상세</h4>
      ${invDetailPalletTable(freePallets)}
      <h4 style="margin:14px 0 8px;font-size:13.5px;">매칭 안 된 부족수요 상세</h4>
      ${invDetailOrderTable(groupOrders.filter(r=>r.cov.shortage>0))}
    `;
  } else if(metric==='shortage'){
    title = `부족재고 근거 · ${label}`;
    const shortage = Math.max(0, totalShortage - freeNow);
    let cumulative = freeNow, resolveDate = null, resolveRows = [];
    for(const p of futurePlans){
      cumulative += (p.planned_pallet_count||0);
      resolveRows.push(p);
      if(cumulative >= totalShortage){ resolveDate = p.planned_production_date; break; }
    }
    bodyHtml = `
      <div class="panel" style="margin-bottom:14px;"><div class="panel-body" style="font-size:13px;line-height:1.9;">
        부족수요(매칭 안 된 발주분) <b>${totalShortage}</b> − 현재고 <b>${freeNow}</b> = 부족재고 <b style="color:var(--red)">${shortage}</b><br>
        ${shortage<=0 ? '' : resolveDate
          ? `→ 예정된 생산계획을 누적하면 <b>${fmtDateDisp(resolveDate)}</b> 생산분까지 반영 시 부족이 해소됩니다.`
          : `→ 예정된 생산계획을 모두 더해도(${futurePlans.reduce((a,p)=>a+(p.planned_pallet_count||0),0)}개) 부족분을 채우지 못합니다. 생산계획 추가가 필요합니다.`}
      </div></div>
      <h4 style="margin-bottom:8px;font-size:13.5px;">부족을 유발한 발주</h4>
      ${invDetailOrderTable(groupOrders.filter(r=>r.cov.shortage>0))}
      <h4 style="margin:14px 0 8px;font-size:13.5px;">해소에 사용되는 생산계획(생산예정일 순)</h4>
      ${invDetailPlanTable(resolveDate ? resolveRows : futurePlans)}
    `;
  }
  openModal(title, bodyHtml, [{ label:'닫기', cls:'btn-ghost', onClick: closeModal }], true);
}
let DASH_FILTERS = { periodMode:'month', from: todayKST().slice(0,7)+'-01', to: lastDayOfMonthISO(todayKST().slice(0,7)) };
let DASH_WEEK_OFFSET = 0;
let DASH_ORDER_VIEW = 'progress';
async function renderDashboard(){
  const today = todayKST();
  const weekStart = startOfWeekISO(today);
  const calWeekStart = addDaysISO(weekStart, DASH_WEEK_OFFSET*7);

  const [ordersAll, plansAll, pallets, reservations, orderChangesRaw, profileNames] = await Promise.all([
    loadOrdersFull(null, null),
    loadProductionPlans(null, null),
    loadPalletsFull({}),
    sb.from('costco_warehouse_reservations').select('order_no, reservation_status').then(r=>r.data||[]),
    loadRecentOrderChanges(),
    loadProfileNameMap(),
  ]);
  const resvByOrderNo = {};
  reservations.forEach(r=>{ resvByOrderNo[r.order_no] = r.reservation_status; });
  const activeOrders = ordersAll.filter(o=>o.status!=='취소');
  const activePlans = plansAll.filter(p=>p.status!=='취소');
  STATE.cache.dashInv = { activeOrders, activePlans, pallets };
  STATE.cache.orders = ordersAll;

  // ---- 승인 대기 중인 발주 변경 요청 (출고예정일/납품일) ----
  const pendingChangeOrders = activeOrders.filter(o=>o.change_status==='대기');
  const myRejectedChanges = activeOrders.filter(o=>o.change_status==='거절됨' && STATE.profile && o.change_requested_by===STATE.profile.id);

  // ---- 최근 발주 변경(7일 이내, 아직 매칭완료/출고완료 되지 않은 건만) ----
  const recentOrderChanges = orderChangesRaw.filter(c=>{
    const ord = activeOrders.find(o=>o.id===c.order_id);
    if(!ord) return false;
    const cov = orderCoverage(ord, pallets);
    return cov.reserved < (ord.planned_pallet_count||0);
  });

  const periodLabel = (DASH_FILTERS.periodMode==='month') ? (DASH_FILTERS.from||'').slice(0,7).replace('-','.')+'월'
    : (DASH_FILTERS.periodMode==='year') ? (DASH_FILTERS.from||'').slice(0,4)+'년'
    : `${fmtDateDisp(DASH_FILTERS.from)}~${fmtDateDisp(DASH_FILTERS.to)}`;

  // ---- 도넛 1: 생산계획 대비 생산량 ----
  const periodPlans = activePlans.filter(p=>(p.planned_production_date||'')>=DASH_FILTERS.from && (p.planned_production_date||'')<=DASH_FILTERS.to);
  const planTotalQty = periodPlans.reduce((a,p)=>a+(p.planned_pallet_count||0),0);
  const planDoneQty = periodPlans.filter(p=>p.status==='생산완료').reduce((a,p)=>a+(p.planned_pallet_count||0),0);
  const planPct = planTotalQty>0 ? Math.round(planDoneQty/planTotalQty*100) : 0;

  // ---- 도넛 2: 출고예정 대비 실제 출고 ----
  const periodOrders = activeOrders.filter(o=>(o.planned_ship_date||'')>=DASH_FILTERS.from && (o.planned_ship_date||'')<=DASH_FILTERS.to);
  const orderTotalQty = periodOrders.reduce((a,o)=>a+(o.planned_pallet_count||0),0);
  const orderDispatchedQty = periodOrders.reduce((a,o)=>a+orderCoverage(o,pallets).dispatched,0);
  const orderPct = orderTotalQty>0 ? Math.round(orderDispatchedQty/orderTotalQty*100) : 0;

  // ---- 도넛 3: 출고대기(미착수 포함, 아직 출고완료되지 않은 전체 수량) ----
  const waitingPeriodCount = orderTotalQty - orderDispatchedQty;
  const waitingPct = orderTotalQty>0 ? Math.round(waitingPeriodCount/orderTotalQty*100) : 0;

  // ---- 재고현황: 파렛트유형×국가별 출고예정/현재고/생산계획/여유재고/부족재고 ----
  const invRows = computeInventoryStatusByGroup(activeOrders, activePlans, pallets);

  // ---- 도넛 4: 입고예약 완료율 ----
  const periodOrderNos = [...new Set(periodOrders.map(o=>o.order_no))];
  const resvDoneCount = periodOrderNos.filter(no=>resvByOrderNo[no]==='예약완료').length;
  const resvPct = periodOrderNos.length>0 ? Math.round(resvDoneCount/periodOrderNos.length*100) : 0;

  // ---- 도넛 5: 발주확인 완료율 ----
  const confirmDoneCount = periodOrders.filter(o=>o.production_confirmed).length;
  const confirmPct = periodOrders.length>0 ? Math.round(confirmDoneCount/periodOrders.length*100) : 0;

  function dayInfo(date){
    const planQty = activePlans.filter(p=>p.planned_production_date===date).reduce((a,p)=>a+(p.planned_pallet_count||0),0);
    const dayOrders = activeOrders.filter(o=>o.planned_ship_date===date);
    const orderQty = dayOrders.reduce((a,o)=>a+(o.planned_pallet_count||0),0);
    const byDest = {};
    dayOrders.forEach(o=>{
      const key = o.destination_id || 'none';
      byDest[key] = (byDest[key]||0) + (o.planned_pallet_count||0);
    });
    const destBreakdown = Object.entries(byDest).map(([destId,qty])=>({
      name: destId==='none' ? '납품처 미지정' : destinationName(destId), qty
    }));
    return { date, planQty, orderQty, destBreakdown, isToday: date===today };
  }
  const weekDayNames = ['월','화','수','목','금','토','일'];
  const weekDays = Array.from({length:7}, (_,i)=>{
    const date = addDaysISO(calWeekStart, i);
    return { ...dayInfo(date), name: weekDayNames[i] };
  });

  const atRiskIds = computeAtRiskOrderIds(activeOrders, activePlans, pallets);
  const orderRows = activeOrders.map(o=>{
    const cov = orderCoverage(o, pallets);
    const progressPct = o.planned_pallet_count>0 ? Math.round((cov.reserved/o.planned_pallet_count)*100) : 0;
    const resvStatus = resvByOrderNo[o.order_no] || '미완료';
    return { o, matched: cov.matched, dispatched: cov.dispatched, reserved: cov.reserved, shortage: cov.shortage, status: orderStatusOf(o, pallets), progressPct, resvStatus, atRisk: atRiskIds.has(o.id) };
  }).sort((a,b)=> (a.o.planned_ship_date||'') < (b.o.planned_ship_date||'') ? -1 : 1);
  const orderProgressRows = orderRows.filter(r=>r.status!=='출고완료');
  const orderDoneRows = orderRows.filter(r=>r.status==='출고완료');
  const shownOrderRows = DASH_ORDER_VIEW==='done' ? orderDoneRows : orderProgressRows;

  // ---- 알림: 여유재고 있는데 매칭 안 된 발주 ----
  const unmatchedAlerts = [];
  const freeAllByKey = {};
  pallets.filter(p=>p.status==='재고보유').forEach(p=>{
    const key = p.product_id+'|'+p.country_id;
    freeAllByKey[key] = (freeAllByKey[key]||0)+1;
  });
  Object.keys(freeAllByKey).forEach(key=>{
    const [productId, countryId] = key.split('|');
    const needy = activeOrders.some(o=>o.product_id===productId && o.country_id===countryId && orderStatusOf(o,pallets)!=='출고완료' && orderCoverage(o,pallets).reserved < (o.planned_pallet_count||0));
    if(needy){
      unmatchedAlerts.push({ name: `${productName(productId)} · ${countryName(countryId)}`, count: freeAllByKey[key] });
    }
  });

  const html = `
    ${pendingChangeOrders.length? `
    <div class="panel" style="border-left:4px solid var(--red);">
      <div class="panel-body">
        <b style="color:var(--red);">🚨 출고예정일/납품일 변경 승인이 필요합니다 (${pendingChangeOrders.length}건)</b>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:10px;">
          ${pendingChangeOrders.map(o=>{
            const who = profileNames[o.change_requested_by] || '';
            const when = o.change_requested_at ? fmtDateDisp(o.change_requested_at.slice(0,10)) : '';
            const canApprove = can('admin') || (STATE.profile && STATE.profile.id === o.production_confirmed_by);
            return `
            <div style="padding:10px 12px;background:#fff5f5;border:1px solid #fecaca;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div>
                <b>${esc(o.order_no)}</b> · ${esc(orderChangeSummary(o))}
                <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">요청: ${esc(who)}${when?` · ${esc(when)}`:''}</div>
              </div>
              <div>
                ${canApprove?`
                  <button class="btn btn-primary btn-sm" onclick="approveOrderChange('${o.id}')">승인</button>
                  <button class="btn btn-ghost btn-sm" onclick="rejectOrderChange('${o.id}')">거절</button>
                `:`<button class="btn btn-ghost btn-sm" onclick="switchTab('orders')">발주관리에서 확인</button>`}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
    ` : ''}

    ${myRejectedChanges.length? `
    <div class="panel" style="border-left:4px solid var(--ink-soft);">
      <div class="panel-body">
        <b>❗ 내가 요청한 발주 변경이 거절되었습니다 (${myRejectedChanges.length}건)</b>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:10px;">
          ${myRejectedChanges.map(o=>{
            const rejectedBy = profileNames[o.change_rejected_by] || '';
            const when = o.change_rejected_at ? fmtDateDisp(o.change_rejected_at.slice(0,10)) : '';
            return `
            <div style="padding:10px 12px;background:#f3f4f6;border:1px solid var(--line);border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div>
                <b>${esc(o.order_no)}</b> · 거절됨: ${esc(orderChangeSummary(o))}
                <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">거절: ${esc(rejectedBy)}${when?` · ${esc(when)}`:''}</div>
              </div>
              <div><button class="btn btn-ghost btn-sm" onclick="acknowledgeOrderChangeRejection('${o.id}')">확인</button></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
    ` : ''}

    ${unmatchedAlerts.length? `
    <div class="panel" style="border-left:4px solid var(--amber);">
      <div class="panel-body">
        <b style="color:var(--accent-dark);">⚠ 매칭이 필요한 여유재고가 있습니다</b>
        <div style="margin-top:6px;font-size:13px;color:var(--ink-soft);">
          ${unmatchedAlerts.map(a=>`${esc(a.name)}: 여유재고 ${a.count}개`).join(' &nbsp;·&nbsp; ')}
        </div>
        <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="switchTab('dispatch')">출고관리에서 매칭하기</button>
      </div>
    </div>
    ` : ''}

    ${recentOrderChanges.length? `
    <div class="panel" style="border-left:4px solid #0ea5e9;">
      <div class="panel-head"><h3>최근 발주 변경 (7일 이내)</h3></div>
      <div class="panel-body pad0"><div class="table-wrap"><table>
        <thead><tr><th>발주번호</th><th>변경내용</th><th>변경일시</th></tr></thead>
        <tbody>
        ${recentOrderChanges.map(c=>`
          <tr>
            <td>${esc(c.order_no)}</td>
            <td>${(c.changes||[]).map(ch=>`${esc(ch.field)}: ${ch.old?fmtDateDisp(ch.old):'-'} → ${ch.new?fmtDateDisp(ch.new):'-'}`).join(' &nbsp;/&nbsp; ')}</td>
            <td>${fmtDateDisp((c.changed_at||'').slice(0,10))}</td>
          </tr>`).join('')}
        </tbody>
      </table></div></div>
    </div>
    ` : ''}

    <div class="panel">
      <div class="panel-head">
        <h3>기간 선택</h3>
        <div class="toolbar">${periodPickerHtml(DASH_FILTERS, 'dashboard', 'DASH_FILTERS')}</div>
      </div>
      <div class="panel-body">
        <div style="display:flex;gap:28px;flex-wrap:wrap;justify-content:space-around;padding:8px 0;">
          ${donutSvg(planPct, 'var(--blue)', '생산계획', `${esc(periodLabel)} · ${planDoneQty}/${planTotalQty} 파렛트`)}
          ${donutSvg(orderPct, 'var(--green)', '출고예정', `${esc(periodLabel)} · ${orderDispatchedQty}/${orderTotalQty} 파렛트`)}
          ${donutSvg(waitingPct, 'var(--amber)', '출고대기', `${esc(periodLabel)} · 전체 ${orderTotalQty}파렛트 중 미출고`, `${waitingPeriodCount}`)}
          ${donutSvg(confirmPct, '#0ea5e9', '발주확인', `${confirmDoneCount}/${periodOrders.length} 건`)}
          ${donutSvg(resvPct, '#8b5cf6', '입고예약확인', `${resvDoneCount}/${periodOrderNos.length} 건`)}
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>재고현황 (파렛트유형 × 국가)</h3></div>
      <div class="panel-body pad0"><div class="table-wrap"><table>
        <thead><tr><th>파렛트유형</th><th>국가</th><th>출고예정</th><th>매칭완료</th><th>현재고</th><th>생산계획</th><th>여유재고</th><th>부족재고</th><th>상태</th></tr></thead>
        <tbody>
        ${invRows.length? invRows.map(r=>`
          <tr>
            <td>${esc(productName(r.productId))}</td>
            <td>${esc(countryName(r.countryId))}</td>
            <td class="inv-num" onclick="showInvDetail('${r.productId}','${r.countryId}','demand')">${r.demandQty}</td>
            <td class="inv-num" onclick="showInvDetail('${r.productId}','${r.countryId}','matched')">${r.matchedQty>0?`<span style="color:var(--blue);font-weight:700;">${r.matchedQty}</span>`:'0'}</td>
            <td class="inv-num" onclick="showInvDetail('${r.productId}','${r.countryId}','free')">${r.freeNow}</td>
            <td class="inv-num" onclick="showInvDetail('${r.productId}','${r.countryId}','plan')">${r.planQty}</td>
            <td class="inv-num" onclick="showInvDetail('${r.productId}','${r.countryId}','freeStock')">${r.freeStock>0?`<b style="color:var(--green)">${r.freeStock}</b>`:'0'}</td>
            <td class="inv-num" onclick="showInvDetail('${r.productId}','${r.countryId}','shortage')">${r.shortage>0?`<b style="color:var(--red)">${r.shortage}</b>`:'0'}</td>
            <td>${invStatusBadge(r)}</td>
          </tr>`).join('') : `<tr><td colspan="9" class="empty-row">표시할 재고 현황이 없습니다.</td></tr>`}
        </tbody>
      </table></div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>발주번호별 진행현황</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn ${DASH_ORDER_VIEW==='progress'?'btn-primary':'btn-ghost'} btn-sm" onclick="DASH_ORDER_VIEW='progress'; switchTab('dashboard')">진행중 (${orderProgressRows.length})</button>
          <button class="btn ${DASH_ORDER_VIEW==='done'?'btn-primary':'btn-ghost'} btn-sm" onclick="DASH_ORDER_VIEW='done'; switchTab('dashboard')">출고완료 (${orderDoneRows.length})</button>
        </div>
      </div>
      <div class="panel-body pad0"><div class="table-wrap"><table>
        <thead><tr><th>발주번호</th><th>납품처</th><th>출고예정일</th><th>파렛트유형</th><th>발주수량</th><th>매칭완료</th><th>부족수량</th><th>진행률</th><th>입고예약</th><th>진행상태</th><th>생산경고</th></tr></thead>
        <tbody>
        ${shownOrderRows.length? shownOrderRows.map(r=>`
          <tr>
            <td>${esc(r.o.order_no)}</td>
            <td>${esc(destinationName(r.o.destination_id))}</td>
            <td>${fmtDateDisp(r.o.planned_ship_date)}</td>
            <td>${esc(productName(r.o.product_id))}</td>
            <td>${r.o.planned_pallet_count}</td>
            <td>${r.matched}</td>
            <td>${r.shortage>0?`<b style="color:var(--red)">${r.shortage}</b>`:'0'}</td>
            <td>
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="flex:1;min-width:60px;height:8px;border-radius:99px;background:#eef0f3;overflow:hidden;">
                  <div style="height:100%;width:${r.progressPct}%;background:${r.progressPct>=100?'var(--green)':'var(--amber)'};border-radius:99px;"></div>
                </div>
                <span style="font-size:12px;color:var(--ink-soft);white-space:nowrap;">${r.progressPct}%</span>
              </div>
            </td>
            <td>${r.resvStatus==='예약완료'?'<span class="badge b-green">예약완료</span>':'<span class="badge b-amber">미완료</span>'}</td>
            <td>${orderStatusBadge(r.status)}</td>
            <td>${r.atRisk?'<span class="badge b-red">⚠ 생산부족</span>':''}</td>
          </tr>`).join('') : `<tr><td colspan="11" class="empty-row">표시할 발주가 없습니다.</td></tr>`}
        </tbody>
      </table></div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>주간 캘린더 (월~일, KST)</h3>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="btn btn-ghost btn-sm" onclick="DASH_WEEK_OFFSET--; switchTab('dashboard')">‹</button>
          <b style="font-size:13px;">${fmtDateDisp(calWeekStart)} ~ ${fmtDateDisp(addDaysISO(calWeekStart,6))}</b>
          <button class="btn btn-ghost btn-sm" onclick="DASH_WEEK_OFFSET++; switchTab('dashboard')">›</button>
          ${DASH_WEEK_OFFSET!==0?`<button class="btn btn-ghost btn-sm" onclick="DASH_WEEK_OFFSET=0; switchTab('dashboard')">오늘로</button>`:''}
        </div>
      </div>
      <div class="panel-body pad0"><div class="table-wrap"><table>
        <thead><tr><th style="width:90px;"></th>${weekDays.map(d=>`<th style="${d.isToday?'color:var(--blue);':''}">${d.name} ${fmtDateDisp(d.date).slice(5)}${d.isToday?' (오늘)':''}</th>`).join('')}</tr></thead>
        <tbody>
          <tr>
            <td style="font-weight:700;">생산계획</td>
            ${weekDays.map(d=>`<td>${d.planQty>0?`<div><b>${d.planQty} 파렛트</b></div><span class="badge b-blue">생산예정</span>`:`<span class="badge b-navy">생산없음</span>`}</td>`).join('')}
          </tr>
          <tr>
            <td style="font-weight:700;">출고예정</td>
            ${weekDays.map(d=>`<td>${d.orderQty>0?`
              <div><b>${d.orderQty} 파렛트</b></div>
              <span class="badge b-green">출고예정</span>
              <div style="margin-top:6px;font-size:12px;color:var(--ink-soft);text-align:left;">
                ${d.destBreakdown.map(x=>`${esc(x.name)}: ${x.qty}`).join('<br>')}
              </div>
              `:`<span class="badge b-navy">출고없음</span>`}</td>`).join('')}
          </tr>
        </tbody>
      </table></div></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}
</script>
<script>
/* ============================================================
   발주관리
   ============================================================ */
let ORDER_FILTERS = { periodMode:'month', from: todayKST().slice(0,7)+'-01', to: lastDayOfMonthISO(todayKST().slice(0,7)), q:'' };
let ORDER_VIEW = 'progress';

async function renderOrders(){
  const [orders, pallets, profileNames] = await Promise.all([
    loadOrdersFull(ORDER_FILTERS.from||null, ORDER_FILTERS.to||null),
    loadPalletsFull({}),
    loadProfileNameMap(),
  ]);
  STATE.cache.orders = orders;
  const canManage = can('admin','shipping_manager','production_manager');
  const canConfirm = can('admin','production_manager','shipping_manager');

  let rows = orders.map(o=>({ o, fulfill: o.status==='취소' ? null : orderStatusOf(o, pallets) }));
  if(ORDER_FILTERS.q){
    const q = ORDER_FILTERS.q.toLowerCase();
    rows = rows.filter(r=>(r.o.order_no||'').toLowerCase().includes(q));
  }

          ${canManage?`<button class="btn btn-primary btn-sm" onclick="openOrderModal()">+ 발주 등록</button>`:''}
        </div>
      </div>
      <div class="panel-body pad0"><div class="table-wrap"><table>
        <thead><tr><th>발주번호</th><th>납품요청일</th><th>납품일</th><th>출고예정일</th><th>국가</th><th>납품처</th><th>파렛트유형</th><th>파렛트수량</th><th>상태</th><th>발주확인</th><th>변경승인</th><th></th></tr></thead>
        <tbody>
        ${countryKeys.length? countryKeys.map(ck=>`
          <tr style="background:#fafbfc;"><td colspan="12" style="font-weight:700;">${esc(countryName(ck==='none'?'':ck))} (${groupedByCountry[ck].length}건)</td></tr>
          ${groupedByCountry[ck].map(r=>`
          <tr>
            <td>${esc(r.o.order_no)}</td>
            <td>${fmtDateDisp(r.o.requested_delivery_date)}</td>
            <td>${r.o.actual_delivery_date?fmtDateDisp(r.o.actual_delivery_date):'<span style="color:var(--ink-soft);">-</span>'}</td>
            <td>${fmtDateDisp(r.o.planned_ship_date)}</td>
            <td>${esc(countryName(r.o.country_id))}</td>
            <td>${esc(destinationName(r.o.destination_id))}</td>
            <td>${esc(productName(r.o.product_id))}</td>
            <td>${r.o.planned_pallet_count}</td>
            <td>${r.o.status==='취소'?'<span class="badge b-red">취소</span>':orderStatusBadge(r.fulfill)}</td>
            <td>${orderConfirmCell(r.o, profileNames, canConfirm)}</td>
            <td>${orderChangeApprovalCell(r.o, profileNames)}</td>
            <td>${canManage?`<button class="btn btn-ghost btn-sm" onclick="openOrderModal('${r.o.id}')">수정</button>`:''}${can('admin')?` <button class="btn btn-danger btn-sm" onclick="deleteOrder('${r.o.id}')">삭제</button>`:''}</td>
          </tr>`).join('')}
        `).join('') : `<tr><td colspan="12" class="empty-row">해당하는 발주가 없습니다.</td></tr>`}
        </tbody>
      </table></div></div>

function orderConfirmCell(o, profileNames, canConfirm){
  if(o.status==='취소') return '';
  if(o.production_confirmed){
    const who = profileNames[o.production_confirmed_by] || '';
    const when = o.production_confirmed_at ? fmtDateDisp(o.production_confirmed_at.slice(0,10)) : '';
    const sub = [who, when].filter(Boolean).join(' · ');
    const canUnconfirm = can('admin') || (STATE.profile && STATE.profile.id === o.production_confirmed_by);
    return `<span class="badge b-green" title="${esc(sub)}">확인완료</span>${sub?`<div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${esc(sub)}</div>`:''}${canUnconfirm?`<div><button class="btn btn-ghost btn-sm" style="margin-top:4px;padding:2px 8px;font-size:11px;" onclick="unconfirmOrder('${o.id}')">확인취소</button></div>`:''}`;
  }
  return canConfirm
    ? `<button class="btn btn-primary btn-sm" onclick="confirmOrder('${o.id}')">발주확인</button>`
    : '<span class="badge b-amber">미확인</span>';
}
/* ---------- 발주 변경(출고예정일/납품일) 승인 ---------- */
function orderChangeSummary(o){
  const parts = [];
  if(o.pending_planned_ship_date) parts.push(`출고예정일 ${fmtDateDisp(o.planned_ship_date)}→${fmtDateDisp(o.pending_planned_ship_date)}`);
  if(o.pending_actual_delivery_date) parts.push(`납품일 ${o.actual_delivery_date?fmtDateDisp(o.actual_delivery_date):'-'}→${fmtDateDisp(o.pending_actual_delivery_date)}`);
  return parts.join(', ');
}
function orderChangeApprovalCell(o, profileNames){
  if(o.status==='취소') return '';
  if(o.change_status==='대기'){
    const who = profileNames[o.change_requested_by] || '';
    const canApprove = can('admin') || (STATE.profile && STATE.profile.id === o.production_confirmed_by);
    return `
      <div style="font-size:11px;color:var(--accent-dark);margin-bottom:4px;">${esc(orderChangeSummary(o))}</div>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">요청: ${esc(who)}</div>
      ${canApprove?`
        <button class="btn btn-primary btn-sm" style="padding:2px 8px;font-size:11px;" onclick="approveOrderChange('${o.id}')">승인</button>
        <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px;" onclick="rejectOrderChange('${o.id}')">거절</button>
      `:`<span class="badge b-amber">승인대기</span>`}
    `;
  }
  if(o.change_status==='거절됨'){
    const requestedBy = profileNames[o.change_requested_by] || '';
    const rejectedBy = profileNames[o.change_rejected_by] || '';
    const isRequester = STATE.profile && STATE.profile.id === o.change_requested_by;
    return `
      <div style="font-size:11px;color:var(--red);margin-bottom:4px;">거절됨: ${esc(orderChangeSummary(o))}</div>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">요청 ${esc(requestedBy)} → 거절 ${esc(rejectedBy)}</div>
      ${(isRequester||can('admin'))?`<button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px;" onclick="acknowledgeOrderChangeRejection('${o.id}')">확인</button>`:`<span class="badge b-red">거절됨</span>`}
    `;
  }
  return '';
}
async function approveOrderChange(orderId){
  const order = (STATE.cache.orders||[]).find(x=>x.id===orderId);
  if(!order || order.change_status!=='대기'){ toast('승인 대기 중인 변경 요청이 없습니다.','err'); return; }
  const canApprove = can('admin') || (STATE.profile && STATE.profile.id === order.production_confirmed_by);
  if(!canApprove){ toast('발주확인자 또는 관리자만 승인할 수 있습니다.','err'); return; }
  if(!confirm('변경 요청을 승인하고 반영하시겠습니까?\n'+orderChangeSummary(order))) return;
  const changes = [];
  const payload = { change_status:null, change_requested_by:null, change_requested_at:null, updated_by: STATE.profile.id };
  if(order.pending_planned_ship_date){
    changes.push({ field:'출고예정일', old: order.planned_ship_date, new: order.pending_planned_ship_date });
    payload.planned_ship_date = order.pending_planned_ship_date;
  }
  if(order.pending_actual_delivery_date){
    changes.push({ field:'납품일', old: order.actual_delivery_date, new: order.pending_actual_delivery_date });
    payload.actual_delivery_date = order.pending_actual_delivery_date;
  }
  payload.pending_planned_ship_date = null;
  payload.pending_actual_delivery_date = null;
  try{
    const { data, error } = await sb.from('costco_orders').update(payload).eq('id', orderId).select();
    if(error) throw error;
    if(!data || data.length===0){ toast('저장 권한이 없어 반영되지 않았습니다. 관리자에게 DB 권한 확인을 요청해 주세요.','err'); return; }
    if(changes.length){
      const { error: logErr } = await sb.from('costco_order_change_log').insert({
        order_id: orderId, order_no: order.order_no, changes, changed_by: order.change_requested_by || STATE.profile.id,
      });
      if(logErr) console.error(logErr);
    }
    toast('변경이 승인되어 반영되었습니다.','ok');
    switchTab(STATE.currentTab);
  }catch(e){ toast(friendlyError(e),'err'); }
}
async function rejectOrderChange(orderId){
  const order = (STATE.cache.orders||[]).find(x=>x.id===orderId);
  if(!order || order.change_status!=='대기'){ toast('승인 대기 중인 변경 요청이 없습니다.','err'); return; }

    toast('변경 요청이 거절되었습니다.','ok');
    switchTab(STATE.currentTab);

}

async function deleteOrder(orderId){

  try{
    const { data: linked, error: lErr } = await sb.from('costco_pallets').select('id, status').eq('order_id', orderId).is('deleted_at', null);
    if(lErr) throw lErr;

      toast('이미 매칭완료/출고완료된 파렛트가 연결되어 있어 삭제할 수 없습니다. 출고관리에서 매칭을 먼저 해제해 주세요.','err');

      deleted_at: new Date().toISOString(), updated_by: STATE.profile.id,
    }).eq('id', orderId).select();
